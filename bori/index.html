<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<meta name="color-scheme" content="dark">
<title>Abdulboriy Shukhratov — Social Media &amp; Video</title>
<meta name="description" content="Цифровая визитка. Abdulboriy Shukhratov — Social Media Manager &amp; Videographer. Сохраните контакт в один тап.">
<meta property="og:type" content="profile">
<meta property="og:title" content="Abdulboriy Shukhratov — Social Media &amp; Video">
<meta property="og:description" content="Снимаю видео и веду соцсети, которые работают на ваш бизнес.">
<meta property="og:url" content="https://onetap-uz.github.io/bori/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* ============================================================
   PORTO BELLO TOUR — NFC digital business card
   Тема: тёмный графит + золото. Mobile-first, первый экран без скролла.
   Все данные и цвета настраиваются в объекте CONFIG (ниже, в <script>).
   ============================================================ */

/* --- Дизайн-токены. Цвета перезаписываются из темы, выбранной посетителем
       (CONFIG.themes), при загрузке и при каждой смене цвета --- */
:root{
  --bg:            #0B0B0C;   /* глубокий графит — база */
  --bg-2:          #141416;   /* верхняя точка градиента */
  --bg-3:          #08080A;   /* нижняя точка градиента */
  --glow-top:      #1A1A1D;   /* светлое пятно у верхнего края */
  --gold:          #C9A227;   /* основное золото бренда */
  --gold-rgb:      201,162,39;   /* то же золото — для полупрозрачных оттенков */
  --gold-soft:     #E8D9A8;   /* шампань-золото (блик) */
  --gold-deep:     #8B6F1E;   /* тёмное золото (тень градиента) */
  --cta-end:       #B08D1C;   /* нижняя точка градиента главной кнопки */
  --cta-text:      #14110A;   /* текст на главной кнопке */
  --icon:          #E8D9A8;   /* иконки в круглых кнопках */
  --text:          #F4F1EA;   /* основной текст */
  --muted:         #9A948A;   /* вторичный текст */
  --line:          rgba(var(--gold-rgb),.28);   /* тонкие линии */
  --surface:       rgba(255,255,255,.035); /* фон круглых кнопок */
  --surface-line:  rgba(232,217,168,.20);
  --pill:          rgba(255,255,255,.03);  /* фон переключателей языка и цвета */
  --toast-bg:      rgba(20,20,22,.94);
  --photo-bg:      #1a1a1d;
  --shadow:        rgba(0,0,0,.55);

  --ease: cubic-bezier(.22,.61,.36,1);
}

*,*::before,*::after{ box-sizing:border-box; }

html{ scroll-behavior:smooth; }        /* плавный переход по стрелке «листайте» */
html,body{ min-height:100%; }

body{
  margin:0;
  background:
    radial-gradient(120% 80% at 50% -10%, var(--glow-top) 0%, transparent 60%),
    linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 42%, var(--bg-3) 100%);
  background-attachment:fixed;
  color:var(--text);
  font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}

/* --- Каркас: одна колонка на всю высоту экрана (svh — без скачков в мобильных браузерах) --- */
.card{
  position:relative;
  min-height:100vh;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  padding:
    calc(env(safe-area-inset-top, 0px) + clamp(16px, 3vh, 32px))
    20px
    calc(env(safe-area-inset-bottom, 0px) + clamp(14px, 2.4vh, 26px));
  max-width:520px;
  margin-inline:auto;
}

/* Свечение за фото «дышит» и чуть раздувается — обрезаем его по краю карточки,
   иначе на узких телефонах появляется горизонтальная прокрутка.
   clip не создаёт контейнер прокрутки; html — запасной вариант для старых Safari. */
.card{ overflow-x:clip; }
html{ overflow-x:hidden; }

/* Мягкое золотое свечение за фотографией (ширина ограничена шириной карточки,
   иначе на узких экранах появляется горизонтальный скролл) */
.glow{
  position:absolute; top:-6%; left:50%; translate:-50% 0;
  width:min(560px, 100%); aspect-ratio:1;
  background:radial-gradient(circle, rgba(var(--gold-rgb),.16) 0%, rgba(var(--gold-rgb),.05) 38%, transparent 68%);
  pointer-events:none; z-index:0;
  animation:breathe 7s ease-in-out infinite;       /* свечение медленно «дышит» */
}
@keyframes breathe{
  0%,100%{ opacity:.75; transform:scale(.95); }
  50%    { opacity:1;   transform:scale(1.06); }
}

/* Золотая пыль: редкие искры медленно поднимаются через весь экран.
   Точки создаёт скрипт (dust), позиции и скорость у каждой свои. */
.dust{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
.dust i{
  position:absolute; bottom:-12px;
  width:var(--size); height:var(--size);
  border-radius:50%;
  background:var(--dust, var(--gold-soft));
  box-shadow:0 0 6px 1px rgba(var(--gold-rgb),.7);
  opacity:0;
  animation:float var(--dur) linear var(--delay) infinite;
  will-change:transform, opacity;
}
@keyframes float{
  0%  { transform:translate3d(0,0,0);                  opacity:0;   }
  12% {                                                opacity:.75; }
  55% {                                                opacity:.3;  }
  85% {                                                opacity:.6;  }
  100%{ transform:translate3d(var(--drift),-108vh,0);  opacity:0;   }
}

.hero{
  position:relative; z-index:1;
  flex:1 1 auto;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  width:100%;
  text-align:center;
}

/* ---------- 1. Круглое фото в тонкой золотой рамке ---------- */
.avatar{
  position:relative;
  width:clamp(114px, 33vw, 156px);
  aspect-ratio:1;
  margin-bottom:clamp(18px, 3.2vh, 28px);
}
/* внешнее тонкое кольцо — держится на расстоянии от фото */
.avatar::after{
  content:''; position:absolute; inset:-9px;
  border-radius:50%;
  border:1px solid var(--line);
}
.avatar__ring{                       /* золотая рамка-градиент */
  position:relative;
  width:100%; height:100%;
  border-radius:50%;
  padding:2px;
  background:linear-gradient(150deg, var(--gold-soft) 0%, var(--gold) 38%, var(--gold-deep) 62%, var(--gold-soft) 100%);
  box-shadow:0 18px 44px var(--shadow), inset 0 0 0 1px rgba(0,0,0,.35);
}
/* Блик медленно обходит рамку по кругу; само фото остаётся неподвижным */
.avatar__ring::before{
  content:''; position:absolute; inset:0;
  border-radius:50%;
  background:conic-gradient(from 0deg, var(--gold-deep), var(--gold), var(--gold-soft), var(--gold), var(--gold-deep), var(--gold), var(--gold-soft), var(--gold), var(--gold-deep));
  animation:spin 9s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }
.avatar__ring img{
  position:relative; z-index:1;
  display:block; width:100%; height:100%;
  border-radius:50%;
  object-fit:cover;
  background:var(--photo-bg);
}
/* Внешнее тонкое кольцо мягко пульсирует */
.avatar::after{ animation:halo 3.6s ease-in-out infinite; }
@keyframes halo{
  0%,100%{ transform:scale(1);    opacity:1;  }
  50%    { transform:scale(1.045); opacity:.45; }
}

/* ---------- 2. Имя ---------- */
.name{
  margin:0;
  font-family:'Playfair Display', Georgia, 'Times New Roman', serif;
  font-weight:500;
  font-size:clamp(25px, 7.4vw, 33px);
  line-height:1.18;
  letter-spacing:.005em;
}

/* ---------- 3. Должность ---------- */
.role{
  margin:clamp(9px, 1.6vh, 13px) 0 0;
  color:var(--gold);
  font-size:clamp(9.5px, 2.7vw, 11px);
  font-weight:400;
  text-transform:uppercase;
  letter-spacing:.26em;
  text-indent:.26em;            /* компенсируем разрядку последней буквы */
}

/* ---------- 4. Bio ---------- */
.bio{
  margin:clamp(12px, 2.2vh, 18px) 0 0;
  max-width:31ch;
  color:var(--muted);
  font-size:clamp(12.5px, 3.5vw, 14px);
  line-height:1.62;
}

/* ---------- 5. Тонкий золотой разделитель ---------- */
.divider{
  display:flex; align-items:center; justify-content:center; gap:10px;
  width:min(210px, 62%);
  margin:clamp(16px, 3vh, 28px) 0;
}
.divider span{
  flex:1; height:1px;
  background:linear-gradient(90deg, transparent, var(--line));
}
.divider span:last-child{ background:linear-gradient(90deg, var(--line), transparent); }
.divider i{
  width:5px; height:5px; rotate:45deg;
  background:var(--gold);
  opacity:.85;
}
/* Линии прорисовываются от ромба к краям, ромб проворачивается на месте */
.divider span{ animation:draw .9s var(--ease) 520ms backwards; transform-origin:right center; }
.divider span:last-child{ transform-origin:left center; }
.divider i{ animation:gem 1s var(--ease) 440ms backwards; }
@keyframes draw{ from{ transform:scaleX(0); } }
@keyframes gem { from{ transform:scale(0) rotate(-180deg); opacity:0; } }

/* ---------- 6. Главная кнопка ---------- */
.cta{
  display:flex; align-items:center; justify-content:center; gap:10px;
  width:100%; max-width:340px;
  min-height:clamp(52px, 7.2vh, 58px);
  padding:0 22px;
  position:relative; overflow:hidden;   /* блик не выходит за края кнопки */
  border:0; border-radius:100px;
  background:linear-gradient(135deg, var(--gold-soft) 0%, var(--gold) 52%, var(--cta-end) 100%);
  color:var(--cta-text);
  text-decoration:none;              /* кнопка — это ссылка <a> на .vcf */
  font-family:'Inter', sans-serif;
  font-size:clamp(14px, 4vw, 15.5px);
  font-weight:500;
  letter-spacing:.035em;
  cursor:pointer;
  box-shadow:0 12px 30px rgba(var(--gold-rgb),.24), 0 2px 6px rgba(0,0,0,.4);
  transition:transform .18s var(--ease), box-shadow .25s var(--ease), filter .2s var(--ease);
}
.cta svg{ width:18px; height:18px; flex:none; position:relative; z-index:1; }
.cta span{ position:relative; z-index:1; }
/* Блик пробегает по кнопке раз в несколько секунд */
.cta::after{
  content:''; position:absolute; top:0; bottom:0; left:0;
  width:36%;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
  transform:translateX(-180%) skewX(-18deg);
  animation:shine 5s ease-in-out 1.8s infinite;
}
@keyframes shine{
  0%, 64% { transform:translateX(-180%) skewX(-18deg); }
  100%    { transform:translateX(360%)  skewX(-18deg); }
}
/* Мягкая волна вокруг кнопки: взгляд возвращается к ней сам */
@keyframes ctaPulse{
  0%,100%{ box-shadow:0 12px 30px rgba(var(--gold-rgb),.24), 0 2px 6px rgba(0,0,0,.4), 0 0 0 0 rgba(var(--gold-rgb),.38); }
  60%    { box-shadow:0 14px 34px rgba(var(--gold-rgb),.32), 0 2px 6px rgba(0,0,0,.4), 0 0 0 11px rgba(var(--gold-rgb),0); }
}
.cta:active{                       /* тактильный отклик на нажатие */
  transform:scale(.965);
  box-shadow:0 6px 16px rgba(var(--gold-rgb),.20);
  filter:brightness(.97);
}
.cta:focus-visible{ outline:2px solid var(--gold-soft); outline-offset:3px; }

/* ---------- 7. Ряд круглых иконок ----------
   Размер кнопки вычисляется из ширины ряда и их количества (--n задаётся из JS),
   поэтому иконки всегда помещаются в одну строку — от 320px и шире. */
.links{
  --n:7;                       /* переопределяется в render() */
  --gap:clamp(6px, 2vw, 12px);
  display:flex; flex-wrap:nowrap; align-items:center; justify-content:center;
  gap:var(--gap);
  margin-top:clamp(18px, 3.2vh, 28px);
  width:100%;
}
.links a{
  display:grid; place-items:center;
  flex:0 0 auto;
  width:min(50px, calc((100% - (var(--n) - 1) * var(--gap)) / var(--n)));
  aspect-ratio:1;
  border-radius:50%;
  border:1px solid var(--surface-line);
  background:var(--surface);
  color:var(--icon);
  text-decoration:none;
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  transition:transform .18s var(--ease), border-color .25s var(--ease), background .25s var(--ease), color .25s var(--ease);
  /* кнопки выскакивают по очереди; --i (номер кнопки) задаёт render().
     backwards, а не both: после появления :active снова управляет transform */
  animation:pop .55s var(--ease) calc(640ms + var(--i, 0) * 70ms) backwards;
}
@keyframes pop{ from{ opacity:0; transform:translateY(10px) scale(.6); } }
.links a svg{ width:clamp(17px, 4.6vw, 20px); height:auto; }
.links a:active{
  transform:scale(.9);
  background:rgba(var(--gold-rgb),.14);
  border-color:var(--gold);
  color:#fff;
}
.links a:focus-visible{ outline:2px solid var(--gold-soft); outline-offset:3px; }
@media (hover:hover){
  .links a:hover{ border-color:var(--gold); background:rgba(var(--gold-rgb),.10); }
  .cta:hover{ box-shadow:0 16px 36px rgba(var(--gold-rgb),.3); }
}

/* ---------- 8. Подвал: логотип и слоган ---------- */
.foot{
  position:relative; z-index:1;
  flex:0 0 auto;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  padding-top:clamp(14px, 2.6vh, 22px);
  text-align:center;
}
.foot .mark{
  width:34px; height:1px;
  background:linear-gradient(90deg, transparent, var(--line), transparent);
  margin-bottom:4px;
}
.logo{
  font-family:'Playfair Display', Georgia, serif;
  font-weight:500;
  font-size:clamp(13px, 3.6vw, 15px);
  letter-spacing:.2em; text-indent:.2em;
  text-transform:uppercase;
  color:var(--gold);
}
.tagline{
  margin:0;
  font-family:'Playfair Display', Georgia, serif;
  font-style:italic;
  font-size:clamp(11.5px, 3.2vw, 13px);
  letter-spacing:.02em;
  color:var(--muted);
  opacity:.8;
}

/* ---------- Переключатель языка ---------- */
.langs{
  position:absolute; z-index:3;
  top:calc(env(safe-area-inset-top, 0px) + 10px);
  right:16px;
  display:flex; gap:2px;
  padding:3px;
  border:1px solid var(--surface-line);
  border-radius:100px;
  background:var(--pill);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
}
.langs button{
  border:0; background:none; cursor:pointer;
  padding:5px 9px;
  border-radius:100px;
  color:var(--muted);
  font-family:'Inter', sans-serif;
  font-size:10px; font-weight:500;
  letter-spacing:.09em; text-transform:uppercase;
  transition:color .2s var(--ease), background .2s var(--ease), transform .15s var(--ease);
}
.langs button[aria-pressed="true"]{
  background:rgba(var(--gold-rgb),.16);
  color:var(--gold);
}
.langs button:active{ transform:scale(.92); }
.langs button:focus-visible{ outline:2px solid var(--gold-soft); outline-offset:2px; }

/* ---------- Переключатель цвета (CONFIG.themes) ----------
   Зеркально языкам — слева сверху. Кружок = цвет темы, выбранный обведён. */
.themes{
  position:absolute; z-index:3;
  top:calc(env(safe-area-inset-top, 0px) + 10px);
  left:16px;
  display:flex; gap:1px;
  padding:3px;
  border:1px solid var(--surface-line);
  border-radius:100px;
  background:var(--pill);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
}
.themes button{
  display:grid; place-items:center;
  width:24px; height:24px;
  padding:0; border:0; border-radius:50%;
  background:none; cursor:pointer;
}
.themes button i{
  width:13px; height:13px;
  border-radius:50%;
  background:var(--sw);
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.35);
  transition:transform .25s var(--ease), box-shadow .25s var(--ease);
}
.themes button[aria-pressed="true"] i{
  transform:scale(1.08);
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.35), 0 0 0 2px var(--bg), 0 0 0 3.2px var(--gold);
}
.themes button:active i{ transform:scale(.8); }
.themes button:focus-visible{ outline:2px solid var(--gold-soft); outline-offset:1px; }

/* Смена цвета: новая тема растекается кругом от нажатого кружка
   (View Transitions; где их нет — цвет меняется мгновенно) */
::view-transition-old(root), ::view-transition-new(root){ animation:none; mix-blend-mode:normal; }

/* ---------- Стрелка «листайте дальше» ---------- */
.scroll-hint{
  display:grid; place-items:center;
  width:32px; height:32px;
  margin-top:clamp(6px, 1.2vh, 12px);
  color:var(--gold); opacity:.7;
  animation:bob 2.1s ease-in-out infinite;
}
.scroll-hint svg{ width:16px; height:16px; }
@keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(5px); } }

/* ---------- Вторая секция: маршрут с остановками ---------- */
.routes{
  position:relative; z-index:1;
  max-width:520px; margin-inline:auto;
  padding:clamp(38px, 7vh, 70px) 20px 0;
}
.sec-head{ text-align:center; margin-bottom:clamp(24px, 4vh, 38px); }
.sec-kicker{
  display:block;
  color:var(--gold);
  font-size:clamp(9.5px, 2.7vw, 10.5px);
  text-transform:uppercase; letter-spacing:.26em; text-indent:.26em;
  margin-bottom:9px;
}
.sec-title{
  margin:0;
  font-family:'Playfair Display', Georgia, serif;
  font-weight:500;
  font-size:clamp(21px, 5.8vw, 27px);
  line-height:1.25;
}

/* Пунктирная нить слева и ромбы-остановки на ней */
.route{ list-style:none; margin:0; padding:0 0 0 30px; position:relative; }
.route::before{
  content:''; position:absolute; left:6px; top:10px; bottom:10px;
  width:1px;
  background:repeating-linear-gradient(to bottom, var(--line) 0 5px, transparent 5px 11px);
}
.route li{
  position:relative;
  margin-bottom:clamp(16px, 2.8vh, 26px);
  opacity:0; transform:translateY(18px);
  transition:opacity .7s var(--ease), transform .7s var(--ease);
}
.route li:last-child{ margin-bottom:0; }
.route li.is-in{ opacity:1; transform:none; }
.route li::before{                 /* точка остановки поверх нити */
  content:''; position:absolute; left:-28px; top:18px;
  width:8px; height:8px; rotate:45deg;
  background:var(--gold);
  box-shadow:0 0 0 4px var(--bg), 0 0 12px rgba(var(--gold-rgb),.75);
}

.stop{
  position:relative; display:block;
  margin:0;                          /* у figure свой отступ в браузере — снимаем */
  border-radius:16px; overflow:hidden;
  border:1px solid var(--surface-line);
  aspect-ratio:16/10;
  background:#141416;
  box-shadow:0 14px 32px rgba(0,0,0,.45);
}
.stop img{
  display:block; width:100%; height:100%;
  object-fit:cover;
}
.stop::after{                      /* затемнение под подписью */
  content:''; position:absolute; inset:0;
  background:linear-gradient(to top, rgba(6,6,9,.9) 0%, rgba(6,6,9,.3) 42%, transparent 68%);
}
.stop b{
  position:absolute; left:15px; bottom:12px; z-index:1;
  font-family:'Playfair Display', Georgia, serif;
  font-weight:500;
  font-size:clamp(16px, 4.4vw, 19px);
  letter-spacing:.01em;
}
.stop small{
  position:absolute; right:15px; bottom:16px; z-index:1;
  color:var(--gold);
  font-size:clamp(9px, 2.5vw, 10px);
  text-transform:uppercase; letter-spacing:.18em;
}

/* Финальная карточка маршрута: шире, подпись по центру, точка на нити крупнее.
   Это конец нити — дальше уже весь мир. */
.route li.finale{ margin-top:clamp(20px, 3.4vh, 30px); }
.route li.finale::before{
  width:11px; height:11px;
  top:22px; left:-29.5px;
  box-shadow:0 0 0 4px var(--bg), 0 0 18px rgba(var(--gold-rgb),.9);
}
.finale .stop{ aspect-ratio:16/9; border-color:var(--line); }
.finale .stop::after{
  background:linear-gradient(to top, rgba(6,6,9,.86) 0%, rgba(6,6,9,.45) 55%, rgba(6,6,9,.2) 100%);
}
.finale .stop b{
  left:0; right:0; bottom:auto; top:50%;
  translate:0 -50%;
  text-align:center;
  font-size:clamp(19px, 5.4vw, 24px);
  letter-spacing:.02em;
  text-shadow:0 2px 18px rgba(0,0,0,.6);
}

/* ---------- Кнопка «поделиться» ---------- */
.share{
  display:inline-flex; align-items:center; justify-content:center; gap:9px;
  margin-top:clamp(10px, 1.8vh, 15px);
  padding:12px 22px;
  border:1px solid var(--surface-line);
  border-radius:100px;
  background:rgba(255,255,255,.03);
  color:var(--text);
  font-family:'Inter', sans-serif;
  font-size:clamp(12.5px, 3.4vw, 13.5px);
  text-decoration:none; cursor:pointer;
  transition:transform .18s var(--ease), border-color .25s var(--ease), color .25s var(--ease);
}
.share svg{ width:16px; height:16px; flex:none; }
.share:active{ transform:scale(.96); border-color:var(--gold); color:var(--gold-soft); }
.share:focus-visible{ outline:2px solid var(--gold-soft); outline-offset:3px; }
@media (hover:hover){ .share:hover{ border-color:var(--gold); } }

/* ---------- Закрывающий блок ---------- */
.outro{
  position:relative; z-index:1;
  display:flex; flex-direction:column; align-items:center;
  max-width:520px; margin-inline:auto;
  padding:clamp(32px, 6vh, 58px) 20px calc(env(safe-area-inset-bottom, 0px) + 32px);
  text-align:center;
}
.outro-text{
  margin:0 0 clamp(16px, 2.6vh, 24px);
  max-width:28ch;
  color:var(--muted);
  font-size:clamp(12.5px, 3.5vw, 14px);
  line-height:1.6;
}

/* ---------- Подпись-ссылка «хотите такую же визитку» ---------- */
.promo{
  display:inline-flex; align-items:center; gap:7px;
  margin-top:clamp(8px, 1.4vh, 13px);
  padding:7px 15px;
  border:1px solid var(--surface-line);
  border-radius:100px;
  background:rgba(255,255,255,.03);
  color:var(--muted);
  font-size:clamp(10.5px, 2.9vw, 11.5px);
  letter-spacing:.02em;
  text-decoration:none;
  transition:transform .18s var(--ease), border-color .25s var(--ease), color .25s var(--ease);
}
.promo svg{ width:12px; height:12px; flex:none; opacity:.8; }
.promo:active{ transform:scale(.95); border-color:var(--gold); color:var(--gold-soft); }
.promo:focus-visible{ outline:2px solid var(--gold-soft); outline-offset:3px; }
@media (hover:hover){ .promo:hover{ border-color:var(--gold); color:var(--gold-soft); } }

/* ---------- Уведомление (тост) ---------- */
.toast{
  position:fixed; left:50%; translate:-50% 0;
  bottom:calc(env(safe-area-inset-bottom, 0px) + 88px);   /* выше подвала, чтобы не перекрывать логотип */
  z-index:20;
  max-width:min(360px, calc(100vw - 40px));
  padding:11px 18px;
  border-radius:100px;
  border:1px solid var(--surface-line);
  background:var(--toast-bg);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  box-shadow:0 12px 34px rgba(0,0,0,.5);
  color:var(--text);
  font-size:12.5px; line-height:1.45; text-align:center;
  opacity:0; visibility:hidden; transform:translateY(10px);
  transition:opacity .3s var(--ease), transform .3s var(--ease), visibility .3s;
}
.toast.is-visible{ opacity:1; visibility:visible; transform:translateY(0); }

/* ---------- Плавное появление при загрузке ---------- */
.reveal{
  opacity:0;
  animation:rise .85s var(--ease) forwards;
  animation-delay:var(--d, 0ms);
}
@keyframes rise{
  from{ opacity:0; transform:translateY(16px); }
  to  { opacity:1; transform:translateY(0); }
}
/* Фото появляется мягче — с лёгким приближением */
.avatar.reveal{ animation-name:riseScale; animation-duration:1.1s; }
@keyframes riseScale{
  from{ opacity:0; transform:translateY(10px) scale(.9); }
  to  { opacity:1; transform:translateY(0) scale(1); }
}
/* У главной кнопки к появлению добавляется волна (одно правило на оба,
   иначе .reveal перекрыл бы анимацию кнопки) */
.cta.reveal{
  animation:rise .85s var(--ease) var(--d, 0ms) forwards, ctaPulse 3.2s ease-in-out 1.6s infinite;
}

@media (prefers-reduced-motion:reduce){
  html{ scroll-behavior:auto; }
  .reveal, .cta.reveal{ animation:none; opacity:1; }
  .glow, .avatar::after, .avatar__ring::before, .cta::after,
  .divider span, .divider i, .links a{ animation:none !important; }
  .cta::after{ display:none; }
  .scroll-hint{ animation:none; }
  .route li{ opacity:1; transform:none; }   /* остановки видны без прокрутки */
  *{ transition-duration:.01ms !important; }
}

/* Низкие экраны (iPhone SE и подобные) — ужимаем вертикаль */
@media (max-height:680px){
  .avatar{ width:clamp(100px, 27vw, 120px); margin-bottom:14px; }
  .bio{ font-size:12.5px; }
  .divider{ margin:14px 0; }
  .links{ margin-top:16px; }
}
</style>
</head>

/* ============================================================================
   ЯЗЫК СТРАНИЦЫ
   Выбор запоминается в браузере посетителя. При первом заходе берём язык
   телефона, а если он не из наших — язык по умолчанию.
   ========================================================================== */
const LANG_KEY = 'pb-lang';
let LANG = (function pickLang(){
  const langs = CONFIG.i18n.langs;
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved && langs[saved]) return saved;
  } catch (e) { /* приватный режим — просто идём дальше */ }
  const nav = (navigator.language || '').slice(0, 2).toLowerCase();
  if (langs[nav]) return nav;
  return CONFIG.i18n.fallback;
})();

/** Словарь текущего языка. */
function dict(){
  return CONFIG.i18n.langs[LANG] || CONFIG.i18n.langs[CONFIG.i18n.fallback];
}

/** Смена языка: без перезагрузки, страница просто переписывает свои тексты. */
function setLang(code){
  if (!CONFIG.i18n.langs[code] || code === LANG) return;
  LANG = code;
  try { localStorage.setItem(LANG_KEY, code); } catch (e) { /* не смогли запомнить — не беда */ }
  applyTexts();
}

/* ============================================================================
   ЦВЕТ СТРАНИЦЫ
   Выбор посетителя запоминается так же, как язык. Тема перекрашивает
   CSS-переменные и переключает кнопку контакта на файл с фото в её цвете.
   ========================================================================== */
const THEME_KEY = 'pb-theme';
let THEME = (function pickTheme(){
  try {
    const saved = localStorage.getItem(THEME_KEY);
    const found = CONFIG.themes.find(function(t){ return t.id === saved; });
    if (found) return found;
  } catch (e) { /* приватный режим — берём тему по умолчанию */ }
  return CONFIG.themes[0];
})();

/** '#C9A227' -> '201,162,39' — для rgba(var(--gold-rgb), .x) */
function hexRgb(hex){
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(',');
}

/** Файл контакта этой темы: первая — vcfUrl, остальные — vcfUrl с -id. */
function vcfFor(t){
  const url = CONFIG.contacts.vcfUrl;
  return t === CONFIG.themes[0] ? url : url.replace(/\.vcf$/i, '-' + t.id + '.vcf');
}

/** Кружок темы в переключателе. */
function swatch(t){
  return t.scheme === 'light'
    ? 'linear-gradient(135deg, ' + t.bg2 + ' 0%, ' + t.bg + ' 45%, ' + t.goldSoft + ' 100%)'
    : 'linear-gradient(135deg, ' + t.goldSoft + ' 0%, ' + t.gold + ' 50%, ' + t.goldDeep + ' 100%)';
}

/** Перекрашивает страницу в тему t. */
function applyTheme(t){
  const dark = t.scheme !== 'light';
  const vars = {
    '--bg': t.bg, '--bg-2': t.bg2, '--bg-3': t.bg3, '--glow-top': t.glowTop,
    '--gold': t.gold, '--gold-rgb': hexRgb(t.gold), '--gold-soft': t.goldSoft, '--gold-deep': t.goldDeep,
    '--cta-end': t.ctaEnd, '--cta-text': t.ctaText, '--icon': t.icon || t.goldSoft,
    '--text': t.text, '--muted': t.muted,
    // светлой теме нужны тёмные полупрозрачные слои вместо светлых
    '--surface':      dark ? 'rgba(255,255,255,.035)' : 'rgba(255,255,255,.62)',
    '--surface-line': 'rgba(' + hexRgb(dark ? t.goldSoft : t.gold) + (dark ? ',.20)' : ',.34)'),
    '--pill':         dark ? 'rgba(255,255,255,.03)' : 'rgba(255,255,255,.55)',
    '--toast-bg':     dark ? 'rgba(20,20,22,.94)' : 'rgba(255,255,255,.95)',
    '--photo-bg':     t.bg2,
    '--shadow':       dark ? 'rgba(0,0,0,.55)' : 'rgba(70,52,12,.22)',
    '--dust':         dark ? t.goldSoft : t.gold
  };
  const root = document.documentElement;
  for (const k in vars) root.style.setProperty(k, vars[k]);
  root.style.colorScheme = dark ? 'dark' : 'light';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = t.bg;

  // «Сохранить контакт» ведёт на файл с фото в рамке этого цвета
  document.querySelectorAll('[data-id="savecontact"]').forEach(function(a){ a.href = vcfFor(t); });

  document.querySelectorAll('#themes button').forEach(function(btn){
    btn.setAttribute('aria-pressed', String(btn.dataset.theme === t.id));
  });
}

/** Смена цвета по нажатию: новая тема расходится кругом от кружка. */
function setTheme(id, from){
  const t = CONFIG.themes.find(function(x){ return x.id === id; });
  if (!t || t === THEME) return;
  THEME = t;
  try { localStorage.setItem(THEME_KEY, id); } catch (e) { /* не смогли запомнить — не беда */ }

  const calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!document.startViewTransition || calm || !from) { applyTheme(t); return; }

  const r = from.getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  const end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const vt = document.startViewTransition(function(){ applyTheme(t); });
  vt.ready.then(function(){
    document.documentElement.animate(
      { clipPath: ['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + end + 'px at ' + x + 'px ' + y + 'px)'] },
      { duration: 700, easing: 'cubic-bezier(.22,.61,.36,1)', pseudoElement: '::view-transition-new(root)' }
    );
  }).catch(function(){ /* анимация не удалась — цвет всё равно уже сменился */ });
}

/** Подставляет все тексты выбранного языка в уже построенную страницу. */
function applyTexts(){
  const d = dict(), b = CONFIG.brand, c = CONFIG.contacts;

  document.documentElement.lang = LANG;
  document.title = d.name + ' — ' + b.name;

  const photo = document.getElementById('photo');
  if (photo) photo.alt = d.name + ' — ' + d.role;

  document.getElementById('name').textContent = d.name;
  document.getElementById('role').textContent = d.role;
  document.getElementById('bio').textContent  = d.bio;

  document.querySelectorAll('.cta span').forEach(function(el){ el.textContent = d.ctaLabel; });

  // Подписи круглых кнопок + текст, с которым открывается WhatsApp
  document.querySelectorAll('.links a').forEach(function(a){
    const label = d.actions && d.actions[a.dataset.id];
    if (label) { a.setAttribute('aria-label', label); a.title = label; }
    if (a.dataset.id === 'whatsapp' && c.whatsapp) {
      a.href = c.whatsapp + (d.whatsappText ? '?text=' + encodeURIComponent(d.whatsappText) : '');
    }
  });

  const hint = document.querySelector('.scroll-hint');
  if (hint) hint.setAttribute('aria-label', d.scrollAria);

  const rk = document.getElementById('routesKicker');
  if (rk) {
    rk.textContent = d.routesKicker;
    document.getElementById('routesTitle').textContent = d.routesTitle;
    document.querySelectorAll('.route li').forEach(function(li, i){
      if (li.classList.contains('finale')) {          // последняя карточка «по всему миру»
        li.querySelector('b').textContent = d.finale;
        li.querySelector('img').alt       = d.finale;
        return;
      }
      const city = (d.cities || [])[i];
      if (!city) return;
      li.querySelector('b').textContent     = city.city;
      li.querySelector('small').textContent = city.note || '';
      li.querySelector('img').alt           = city.city;
    });
  }

  const outro = document.getElementById('outroText');
  if (outro) outro.textContent = d.outro;

  const shareSpan = document.querySelector('#shareBtn span');
  if (shareSpan) shareSpan.textContent = d.share;

  const promoSpan = document.querySelector('#promo span');
  if (promoSpan) promoSpan.textContent = d.promo;

  const box = document.getElementById('langs');
  box.setAttribute('aria-label', d.groupLabel);
  box.querySelectorAll('button').forEach(function(btn){
    btn.setAttribute('aria-pressed', String(btn.dataset.lang === LANG));
  });

  const themeBox = document.getElementById('themes');
  themeBox.setAttribute('aria-label', d.themeGroup);
  themeBox.querySelectorAll('button').forEach(function(btn){
    const name = (d.themes || {})[btn.dataset.theme] || btn.dataset.theme;
    btn.setAttribute('aria-label', name); btn.title = name;
  });
}

/**
 * Проявление блоков по мере прокрутки. Если IntersectionObserver недоступен,
 * показываем всё сразу: страница не должна остаться пустой ни при каких условиях.
 */
function revealOnScroll(nodes){
  if (!('IntersectionObserver' in window)) {
    nodes.forEach(function(n){ n.classList.add('is-in'); });
    return;
  }
  const io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); }
    });
  }, { rootMargin: '0px 0px -12% 0px' });
  nodes.forEach(function(n){ io.observe(n); });
}

(function render(){
  const p = CONFIG.person, b = CONFIG.brand, c = CONFIG.contacts;

  // Контент
  document.getElementById('photo').src = CONFIG.photo.page;

  // Главная кнопка собирается из CONFIG.cta (подпись подставит applyTexts)
  const cta = document.getElementById('ctaBtn');
  cta.href = typeof CONFIG.cta.href === 'function' ? CONFIG.cta.href(c) : CONFIG.cta.href;
  cta.innerHTML = (ICONS[CONFIG.cta.id] || '') + '<span></span>';
  if (/^https?:/i.test(cta.href)) { cta.target = '_blank'; cta.rel = 'noopener noreferrer'; }

  // Название бренда и слоган не переводятся: это фирменные слова
  document.getElementById('brandName').textContent = b.name;
  if (b.tagline) document.getElementById('tagline').textContent = b.tagline;
  else document.getElementById('tagline').remove();
  // Круглые кнопки
  const nav = document.getElementById('links');
  CONFIG.actions.forEach(function(a){
    const href = typeof a.href === 'function' ? a.href(c) : a.href;
    if (!href) return;                       // пункт без данных просто не рисуем
    const el = document.createElement('a');
    el.href = href;
    el.innerHTML = ICONS[a.id] || '';
    el.dataset.id = a.id;
    el.style.setProperty('--i', nav.children.length);   // очередь появления
    // внешние ссылки — в новой вкладке; tel:/mailto: — в текущей
    if (/^https?:/i.test(href)) { el.target = '_blank'; el.rel = 'noopener noreferrer'; }
    nav.appendChild(el);
  });
  // Сообщаем CSS фактическое число кнопок — от него считается их размер
  nav.style.setProperty('--n', nav.children.length || 1);

  // Кружки переключения цвета
  const themeBox = document.getElementById('themes');
  CONFIG.themes.forEach(function(t){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.theme = t.id;
    btn.innerHTML = '<i></i>';
    btn.firstChild.style.setProperty('--sw', swatch(t));
    btn.addEventListener('click', function(){ setTheme(t.id, btn); });
    themeBox.appendChild(btn);
  });
  applyTheme(THEME);

  // Золотая пыль. Кому движение мешает — её просто нет
  if (!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) {
    const dust = document.createElement('div');
    dust.className = 'dust';
    dust.setAttribute('aria-hidden', 'true');
    for (let i = 0; i < 16; i++) {
      const s = document.createElement('i');
      s.style.left = (Math.random() * 100).toFixed(1) + '%';
      s.style.setProperty('--size',  (1.4 + Math.random() * 2.2).toFixed(1) + 'px');
      s.style.setProperty('--dur',   (10 + Math.random() * 10).toFixed(1) + 's');
      s.style.setProperty('--delay', (-Math.random() * 20).toFixed(1) + 's');   // сразу в полёте
      s.style.setProperty('--drift', Math.round((Math.random() - .5) * 70) + 'px');
      dust.appendChild(s);
    }
    document.body.prepend(dust);
  }

  // Кнопки переключения языка
  const langBox = document.getElementById('langs');
  CONFIG.i18n.order.forEach(function(code){
    const d = CONFIG.i18n.langs[code];
    if (!d) return;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.lang = code;
    btn.textContent = d.label;
    btn.addEventListener('click', function(){ setLang(code); });
    langBox.appendChild(btn);
  });

  applyTexts();
})();

/* ============================================================================
   vCard 3.0 — генерация и скачивание
   ========================================================================== */

/** Экранирование спецсимволов значения по RFC 2426. */
function esc(v){
  return String(v == null ? '' : v)
    .replace(/\\/g, '\\\\')
    .replace(/\r?\n/g, '\\n')
    .replace(/,/g, '\\,')
    .replace(/;/g, '\\;');
}

/**
 * Сворачивание длинных строк: не более 75 символов, продолжение — с пробела.
 * Критично для PHOTO (base64): без этого часть парсеров рвёт файл.
 * Строки с не-ASCII не режем, чтобы не разорвать многобайтовый символ.
 */
function fold(line){
  if (line.length <= 75 || /[^\x00-\x7F]/.test(line)) return line;
  const parts = [line.slice(0, 75)];
  for (let i = 75; i < line.length; i += 74) parts.push(' ' + line.slice(i, i + 74));
  return parts.join('\r\n');
}

/** Собирает текст .vcf из CONFIG. */
function buildVCard(){
  const p = CONFIG.person, b = CONFIG.brand, c = CONFIG.contacts, ad = c.address;
  const L = [];

  L.push('BEGIN:VCARD');
  L.push('VERSION:3.0');
  L.push('N:' + esc(p.lastName) + ';' + esc(p.firstName) + ';;;');
  L.push('FN:' + esc(p.firstName + ' ' + p.lastName + (p.company ? ' — ' + p.company : '')));

  // Кириллическое написание имени — видно в карточке контакта
  if (p.phoneticFirst) L.push('X-PHONETIC-FIRST-NAME:' + esc(p.phoneticFirst));
  if (p.phoneticLast)  L.push('X-PHONETIC-LAST-NAME:'  + esc(p.phoneticLast));

  // пустые поля пропускаем: пустая строка в контакте выглядит как брак
  if (p.company) L.push('ORG:' + esc(p.company));
  if (p.title)   L.push('TITLE:' + esc(p.title));
  if (c.phone)   L.push('TEL;TYPE=CELL,VOICE:' + c.phone);
  if (c.email)   L.push('EMAIL;TYPE=INTERNET:' + c.email);
  if (c.website) L.push('URL:' + c.website);                 // сайт — основной URL

  // Соцсети: группы item + X-ABLabel, чтобы в телефоне подписи читались словами,
  // а не одинаковым «URL». iOS показывает метку, Android её игнорирует, но ссылку сохраняет.
  [
    ['Telegram',    c.telegram],
    ['WhatsApp',    c.whatsapp],
    ['Instagram',   c.instagram],
    ['Google Maps', c.maps]
  ].filter(function(pair){ return !!pair[1]; })
   .forEach(function(pair, i){
     const g = 'item' + (i + 1);
     L.push(g + '.URL:' + pair[1]);
     L.push(g + '.X-ABLabel:' + esc(pair[0]));
   });

  if (c.instagram) L.push('X-SOCIALPROFILE;TYPE=instagram:' + c.instagram);

  if (ad.street || ad.city || ad.country) {
    L.push('ADR;TYPE=WORK:;;' + esc(ad.street) + ';' + esc(ad.city) + ';' + esc(ad.region) + ';' + esc(ad.zip) + ';' + esc(ad.country));
  }
  if (b.tagline) L.push('NOTE:' + esc(b.tagline));

  // Фото контакта (base64) — самая длинная строка, сворачивается функцией fold()
  if (CONFIG.photo.vcard) L.push('PHOTO;ENCODING=b;TYPE=JPEG:' + CONFIG.photo.vcard);

  L.push('END:VCARD');

  return L.map(fold).join('\r\n') + '\r\n';   // CRLF обязателен по спецификации
}

/* --- Тост --- */
let toastTimer;
function toast(text){
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('is-visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('is-visible'); }, 5200);
}

/**
 * Встроенные браузеры соцсетей (Instagram, Facebook, TikTok и т.п.) часто молча
 * блокируют скачивание файлов — в этом случае подсказываем открыть страницу снаружи.
 */
function isInAppBrowser(){
  const ua = navigator.userAgent || '';
  return /FBAN|FBAV|FB_IAB|Instagram|TikTok|MicroMessenger|Line\//i.test(ua);
}

/**
 * Режим пересборки файла: откройте страницу с ?export в адресе и нажмите кнопку —
 * вместо перехода по ссылке скачается свежий .vcf, собранный из текущего CONFIG.
 * Этот файл кладётся рядом с index.html, и кнопка снова ведёт на него.
 * Нужен только при подготовке визитки, обычный посетитель сюда не попадает.
 */
function exportVCard(){
  const vcf = buildVCard();
  const blob = new Blob([vcf], { type: 'text/vcard;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (CONFIG.ui.vcfFileName || 'contact') + '.vcf';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 4000);
}

/* Поведение кнопок.
   Все они — обычные ссылки, страница в переход не вмешивается: телефон делает
   всё сам. JS добавляет только тактильный отклик, а для контакта — предупреждение
   во встроенных браузерах соцсетей и режим пересборки файла. */
document.querySelectorAll('.cta, .links a, .share, .promo').forEach(function(el){
  el.addEventListener('click', function(e){
    if (navigator.vibrate) { try { navigator.vibrate(12); } catch(err){} }

    // всё дальнейшее касается только ссылки на файл контакта
    if (el.dataset.id !== 'savecontact') return;

    if (/(^|[?&])export($|[=&])/.test(location.search)) {
      e.preventDefault();
      exportVCard();
      return;
    }
    if (isInAppBrowser()) toast(dict().toastInApp);
  });
});
