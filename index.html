<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<meta name="color-scheme" content="dark">
<title>Miran Davlatov — NFC Cards &amp; Web Development</title>
<meta name="description" content="Цифровая визитка. Miran Davlatov — цифровые NFC-визитки и сайты. Сохраните контакт в один тап.">
<meta property="og:type" content="profile">
<meta property="og:title" content="Miran Davlatov — NFC Cards &amp; Web Development">
<meta property="og:description" content="Делаю цифровые визитки и сайты: одно касание — и ваши контакты уже у собеседника.">
<meta property="og:url" content="https://onetap-uz.github.io/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* ============================================================
   PORTO BELLO TOUR — NFC digital business card
   Тема: тёмный графит + золото. Mobile-first, первый экран без скролла.
   Все данные и цвета настраиваются в объекте CONFIG (ниже, в <script>).
   ============================================================ */

/* --- Дизайн-токены. Цвета перезаписываются из темы, выбранной посетителем
       (CONFIG.themes), при загрузке и при каждой смене цвета --- */
:root{
  --bg:            #07070C;   /* почти чёрный с синим подтоном */
  --bg-2:          #0E0E1A;
  --bg-3:          #050509;   /* нижняя точка градиента */
  --accent:        #7C5CFF;   /* фиолетовый — основной акцент */
  --accent-rgb:    124,92,255;   /* он же — для полупрозрачных оттенков */
  --accent-2:      #22D3EE;   /* циан */
  --accent-3:      #FF3D9A;   /* маджента */
  --cta-1:         #5B2BFF;   /* тёмные стопы главной кнопки */
  --cta-2:         #8B2FE8;
  --cta-3:         #C31D7A;
  --icon:          #22D3EE;   /* иконки в круглых кнопках */
  --text:          #F2F2F7;
  --muted:         #9797B0;
  --line:          rgba(var(--accent-rgb),.32);   /* тонкие линии */
  --surface:       rgba(255,255,255,.04);  /* фон круглых кнопок */
  --surface-line:  rgba(var(--accent-rgb),.26);
  --pill:          rgba(255,255,255,.04);  /* фон переключателей языка и цвета */
  --toast-bg:      rgba(20,20,22,.94);
  --photo-bg:      #12121c;
  --blob:          1;                      /* яркость пятен фона (светлой теме — меньше) */

  /* Фирменный градиент: им залиты кнопка, кольцо фото и акцентный текст */
  --grad: linear-gradient(100deg, var(--accent) 0%, var(--accent-2) 50%, var(--accent-3) 100%);

  --ease: cubic-bezier(.22,.61,.36,1);
}

*,*::before,*::after{ box-sizing:border-box; }

html,body{ height:100%; }

body{
  margin:0;
  background:linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 55%, var(--bg-3) 100%);
  background-attachment:fixed;
  color:var(--text);
  font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}

/* --- Каркас: одна колонка на всю высоту экрана (svh — без скачков в мобильных браузерах) --- */
.card{
  position:relative;
  min-height:100vh;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  padding:
    calc(env(safe-area-inset-top, 0px) + clamp(16px, 3vh, 32px))
    20px
    calc(env(safe-area-inset-bottom, 0px) + clamp(14px, 2.4vh, 26px));
  max-width:520px;
  margin-inline:auto;
}

/* Живой фон: три размытых пятна медленно дрейфуют, страница «дышит».
   overflow:hidden обязателен — иначе пятна дают горизонтальный скролл.
   Анимируются только transform, поэтому нагрузка на телефон минимальная. */
.glow{
  position:absolute; inset:0;
  overflow:hidden;
  pointer-events:none; z-index:0;
}
.glow::before, .glow::after, .glow i{
  content:''; position:absolute;
  aspect-ratio:1; border-radius:50%;
  will-change:transform;
}
.glow::before{
  top:-12%; left:-20%; width:min(80vw, 430px);
  background:radial-gradient(circle, var(--accent) 0%, transparent 68%);
  filter:blur(60px); opacity:calc(.55 * var(--blob));
  animation:drift1 19s ease-in-out infinite alternate;
}
.glow::after{
  top:6%; right:-24%; width:min(76vw, 400px);
  background:radial-gradient(circle, var(--accent-2) 0%, transparent 68%);
  filter:blur(64px); opacity:calc(.4 * var(--blob));
  animation:drift2 23s ease-in-out infinite alternate;
}
.glow i{
  bottom:-18%; left:18%; width:min(72vw, 380px);
  background:radial-gradient(circle, var(--accent-3) 0%, transparent 68%);
  filter:blur(70px); opacity:calc(.34 * var(--blob));
  animation:drift3 27s ease-in-out infinite alternate;
}
@keyframes drift1{ from{ transform:translate3d(0,0,0) scale(1);   } to{ transform:translate3d(16%,12%,0) scale(1.18); } }
@keyframes drift2{ from{ transform:translate3d(0,0,0) scale(1.08);} to{ transform:translate3d(-14%,16%,0) scale(.88); } }
@keyframes drift3{ from{ transform:translate3d(0,0,0) scale(.94); } to{ transform:translate3d(18%,-12%,0) scale(1.22);} }

.hero{
  position:relative; z-index:1;
  flex:1 1 auto;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  width:100%;
  text-align:center;
}

/* ---------- 1. Круглое фото в тонкой золотой рамке ---------- */
.avatar{
  position:relative;
  width:clamp(114px, 33vw, 156px);
  aspect-ratio:1;
  margin-bottom:clamp(18px, 3.2vh, 28px);
}
/* внешнее тонкое кольцо — держится на расстоянии от фото */
.avatar::after{
  content:''; position:absolute; inset:-9px;
  border-radius:50%;
  border:1px solid var(--line);
}
/* Рамка-градиент, которая непрерывно вращается. Крутится только подложка
   под фотографией, само фото остаётся неподвижным. */
.avatar__ring{
  position:relative;
  width:100%; height:100%;
  border-radius:50%;
  padding:2.5px;
  box-shadow:0 18px 48px rgba(0,0,0,.6), 0 0 30px rgba(var(--accent-rgb),.35);
}
.avatar__ring::before{
  content:''; position:absolute; inset:0;
  border-radius:50%;
  background:conic-gradient(from 0deg, var(--accent), var(--accent-2), var(--accent-3), var(--accent));
  animation:spin 7s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }
.avatar__ring img{
  position:relative; z-index:1;
  display:block; width:100%; height:100%;
  border-radius:50%;
  object-fit:cover;
  background:var(--photo-bg);
}

/* ---------- 2. Имя ---------- */
.name{
  margin:0;
  font-family:'Playfair Display', Georgia, 'Times New Roman', serif;
  font-weight:500;
  font-size:clamp(25px, 7.4vw, 33px);
  line-height:1.18;
  letter-spacing:.005em;
}

/* ---------- 3. Должность ---------- */
.role{
  margin:clamp(9px, 1.6vh, 13px) 0 0;
  /* текст залит фирменным градиентом */
  background:var(--grad);
  background-size:200% 100%;
  -webkit-background-clip:text; background-clip:text;
  color:transparent;
  font-size:clamp(9.5px, 2.7vw, 11px);
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.26em;
  text-indent:.26em;            /* компенсируем разрядку последней буквы */
  animation:gradShift 7s ease-in-out infinite alternate;
}
@keyframes gradShift{ from{ background-position:0% 50%; } to{ background-position:100% 50%; } }

/* Список преимуществ под био — то, ради чего заказывают.
   Колонка с галочками: пункты не ломаются посреди фразы и читаются
   как перечень того, что человек получает. Блок центрируется целиком,
   а текст внутри выровнен по левому краю. */
.features{
  display:flex; flex-direction:column; align-items:flex-start;
  gap:clamp(4px, .7vh, 7px);
  width:fit-content;
  margin:clamp(11px, 1.9vh, 16px) auto 0;
  color:var(--muted);
  font-size:clamp(10.5px, 2.9vw, 12px);
  line-height:1.45;
  letter-spacing:.01em;
  text-align:left;
}
.features span{
  display:flex; align-items:baseline; gap:8px;
}
.features span::before{
  content:'✓';
  flex:none;
  color:var(--accent-2);
  font-size:.95em;
}

/* ---------- 4. Bio ---------- */
.bio{
  margin:clamp(12px, 2.2vh, 18px) 0 0;
  max-width:31ch;
  color:var(--muted);
  font-size:clamp(12.5px, 3.5vw, 14px);
  line-height:1.62;
}

/* ---------- 5. Тонкий золотой разделитель ---------- */
.divider{
  display:flex; align-items:center; justify-content:center; gap:10px;
  width:min(210px, 62%);
  margin:clamp(16px, 3vh, 28px) 0;
}
.divider span{
  flex:1; height:1px;
  background:linear-gradient(90deg, transparent, var(--line));
}
.divider span:last-child{ background:linear-gradient(90deg, var(--line), transparent); }
.divider i{
  width:5px; height:5px; rotate:45deg;
  background:var(--accent);
  opacity:.85;
}

/* ---------- 6. Главная кнопка ---------- */
.cta{
  display:flex; align-items:center; justify-content:center; gap:10px;
  width:100%; max-width:340px;
  min-height:clamp(52px, 7.2vh, 58px);
  padding:0 22px;
  position:relative; overflow:hidden;
  border:0; border-radius:100px;
  /* Стопы намеренно тёмные: белый текст на них читается уверенно,
     а неон вынесен в свечение вокруг кнопки. */
  background:linear-gradient(100deg, var(--cta-1) 0%, var(--cta-2) 52%, var(--cta-3) 100%);
  color:#fff;
  text-decoration:none;              /* кнопка — это ссылка <a> */
  font-family:'Inter', sans-serif;
  font-size:clamp(14.5px, 4.2vw, 16px);
  font-weight:600;
  letter-spacing:.02em;
  cursor:pointer;
  animation:ctaPulse 2.8s ease-in-out infinite;
  transition:transform .18s var(--ease), filter .2s var(--ease);
}
.cta svg{ width:19px; height:19px; flex:none; position:relative; z-index:1; }
.cta span{ position:relative; z-index:1; }

/* Пульсирующее кольцо: взгляд возвращается к кнопке сам */
@keyframes ctaPulse{
  0%,100%{ box-shadow:0 14px 34px rgba(var(--accent-rgb),.38), 0 0 0 0 rgba(var(--accent-rgb),.42); }
  60%    { box-shadow:0 18px 46px rgba(var(--accent-rgb),.55), 0 0 0 12px rgba(var(--accent-rgb),0); }
}
/* Блик, пробегающий по кнопке раз в несколько секунд */
.cta::after{
  content:''; position:absolute; top:0; bottom:0; left:0;
  width:38%;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.42), transparent);
  transform:translateX(-180%) skewX(-18deg);
  animation:shine 4.2s ease-in-out infinite;
}
@keyframes shine{
  0%, 62% { transform:translateX(-180%) skewX(-18deg); }
  100%    { transform:translateX(340%)  skewX(-18deg); }
}
.cta:active{                       /* тактильный отклик на нажатие */
  transform:scale(.96);
  filter:brightness(1.08);
}
.cta:focus-visible{ outline:2px solid var(--accent-2); outline-offset:3px; }

/* Микроподпись под кнопкой — снимает страх «а вдруг долго» */
.cta-note{
  margin:clamp(8px, 1.4vh, 12px) 0 0;
  color:var(--muted);
  font-size:clamp(10px, 2.8vw, 11.5px);
  letter-spacing:.02em;
}
.cta-note::before{
  content:''; display:inline-block;
  width:6px; height:6px; margin-right:7px;
  border-radius:50%;
  background:#2BE38A;
  box-shadow:0 0 0 0 rgba(43,227,138,.6);
  animation:dot 2.2s ease-out infinite;
}
@keyframes dot{
  0%  { box-shadow:0 0 0 0 rgba(43,227,138,.6); }
  70% { box-shadow:0 0 0 7px rgba(43,227,138,0); }
  100%{ box-shadow:0 0 0 0 rgba(43,227,138,0); }
}

/* ---------- 7. Ряд круглых иконок ----------
   Размер кнопки вычисляется из ширины ряда и их количества (--n задаётся из JS),
   поэтому иконки всегда помещаются в одну строку — от 320px и шире. */
.links{
  --n:7;                       /* переопределяется в render() */
  --gap:clamp(6px, 2vw, 12px);
  display:flex; flex-wrap:nowrap; align-items:center; justify-content:center;
  gap:var(--gap);
  margin-top:clamp(18px, 3.2vh, 28px);
  width:100%;
}
.links a{
  display:grid; place-items:center;
  flex:0 0 auto;
  width:min(50px, calc((100% - (var(--n) - 1) * var(--gap)) / var(--n)));
  aspect-ratio:1;
  border-radius:50%;
  border:1px solid var(--surface-line);
  background:var(--surface);
  color:var(--icon);
  text-decoration:none;
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  transition:transform .18s var(--ease), border-color .25s var(--ease), background .25s var(--ease), color .25s var(--ease);
}
.links a svg{ width:clamp(17px, 4.6vw, 20px); height:auto; }
.links a:active{
  transform:scale(.9);
  background:rgba(var(--accent-rgb),.14);
  border-color:var(--accent);
  color:#fff;
}
.links a:focus-visible{ outline:2px solid var(--accent-2); outline-offset:3px; }
@media (hover:hover){
  .links a:hover{ border-color:var(--accent); background:rgba(var(--accent-rgb),.10); }
  .cta:hover{ box-shadow:0 16px 36px rgba(var(--accent-rgb),.3); }
}

/* ---------- 8. Подвал: логотип и слоган ---------- */
.foot{
  position:relative; z-index:1;
  flex:0 0 auto;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  padding-top:clamp(14px, 2.6vh, 22px);
  text-align:center;
}
.foot .mark{
  width:34px; height:1px;
  background:linear-gradient(90deg, transparent, var(--line), transparent);
  margin-bottom:4px;
}
.logo{
  font-family:'Playfair Display', Georgia, serif;
  font-weight:500;
  font-size:clamp(13px, 3.6vw, 15px);
  letter-spacing:.2em; text-indent:.2em;
  text-transform:uppercase;
  color:var(--accent);
}
.tagline{
  margin:0;
  font-family:'Playfair Display', Georgia, serif;
  font-style:italic;
  font-size:clamp(11.5px, 3.2vw, 13px);
  letter-spacing:.02em;
  color:var(--muted);
  opacity:.8;
}

/* ---------- Переключатель языка ---------- */
.langs{
  position:absolute; z-index:3;
  top:calc(env(safe-area-inset-top, 0px) + 10px);
  right:16px;
  display:flex; gap:2px;
  padding:3px;
  border:1px solid var(--surface-line);
  border-radius:100px;
  background:var(--pill);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
}
.langs button{
  border:0; background:none; cursor:pointer;
  padding:5px 9px;
  border-radius:100px;
  color:var(--muted);
  font-family:'Inter', sans-serif;
  font-size:10px; font-weight:500;
  letter-spacing:.09em; text-transform:uppercase;
  transition:color .2s var(--ease), background .2s var(--ease), transform .15s var(--ease);
}
.langs button[aria-pressed="true"]{
  background:rgba(var(--accent-rgb),.22);
  color:var(--accent-2);
}
.langs button:active{ transform:scale(.92); }
.langs button:focus-visible{ outline:2px solid var(--accent-2); outline-offset:2px; }

/* ---------- Переключатель цвета (CONFIG.themes) ----------
   Зеркально языкам — слева сверху. Кружок = три цвета темы, выбранный обведён. */
.themes{
  position:absolute; z-index:3;
  top:calc(env(safe-area-inset-top, 0px) + 10px);
  left:16px;
  display:flex; gap:1px;
  padding:3px;
  border:1px solid var(--surface-line);
  border-radius:100px;
  background:var(--pill);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
}
.themes button{
  display:grid; place-items:center;
  width:24px; height:24px;
  padding:0; border:0; border-radius:50%;
  background:none; cursor:pointer;
}
.themes button i{
  width:13px; height:13px;
  border-radius:50%;
  background:var(--sw);
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.35);
  transition:transform .25s var(--ease), box-shadow .25s var(--ease);
}
.themes button[aria-pressed="true"] i{
  transform:scale(1.08);
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.35), 0 0 0 2px var(--bg), 0 0 0 3.2px var(--accent);
}
.themes button:active i{ transform:scale(.8); }
.themes button:focus-visible{ outline:2px solid var(--accent-2); outline-offset:1px; }

/* Смена цвета: новая тема растекается кругом от нажатого кружка
   (View Transitions; где их нет — цвет меняется мгновенно) */
::view-transition-old(root), ::view-transition-new(root){ animation:none; mix-blend-mode:normal; }

/* ---------- Уведомление (тост) ---------- */
.toast{
  position:fixed; left:50%; translate:-50% 0;
  bottom:calc(env(safe-area-inset-bottom, 0px) + 88px);   /* выше подвала, чтобы не перекрывать логотип */
  z-index:20;
  max-width:min(360px, calc(100vw - 40px));
  padding:11px 18px;
  border-radius:100px;
  border:1px solid var(--surface-line);
  background:var(--toast-bg);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  box-shadow:0 12px 34px rgba(0,0,0,.5);
  color:var(--text);
  font-size:12.5px; line-height:1.45; text-align:center;
  opacity:0; visibility:hidden; transform:translateY(10px);
  transition:opacity .3s var(--ease), transform .3s var(--ease), visibility .3s;
}
.toast.is-visible{ opacity:1; visibility:visible; transform:translateY(0); }

/* ---------- Плавное появление при загрузке ---------- */
.reveal{
  opacity:0;
  animation:rise .85s var(--ease) forwards;
  animation-delay:var(--d, 0ms);
}
@keyframes rise{
  from{ opacity:0; transform:translateY(16px); }
  to  { opacity:1; transform:translateY(0); }
}
/* Фото появляется мягче — с лёгким приближением */
.avatar.reveal{ animation-name:riseScale; animation-duration:1.1s; }
@keyframes riseScale{
  from{ opacity:0; transform:translateY(10px) scale(.9); }
  to  { opacity:1; transform:translateY(0) scale(1); }
}

/* Кому движение мешает — страница замирает полностью, но остаётся читаемой */
@media (prefers-reduced-motion:reduce){
  .reveal{ animation:none; opacity:1; }
  .glow::before, .glow::after, .glow i,
  .avatar__ring::before, .role, .cta, .cta::after, .cta-note::before{
    animation:none !important;
  }
  .cta{ box-shadow:0 14px 34px rgba(var(--accent-rgb),.38); }
  .cta::after{ display:none; }
  *{ transition-duration:.01ms !important; }
}

/* Низкие экраны (iPhone SE и подобные) — ужимаем вертикаль */
@media (max-height:680px){
  .avatar{ width:clamp(100px, 27vw, 120px); margin-bottom:14px; }
  .bio{ font-size:12.5px; }
  .divider{ margin:14px 0; }
  .links{ margin-top:16px; }
}
</style>
</head>

<body>
  <main class="card">
    <div class="glow" aria-hidden="true"><i></i></div>

    <!-- Переключатель цвета (CONFIG.themes) -->
    <div class="themes" id="themes" role="group"></div>

    <!-- Переключатель языка (CONFIG.i18n) -->
    <div class="langs" id="langs" role="group"></div>

    <section class="hero">
      <!-- 1. Фото -->
      <div class="avatar reveal" style="--d:60ms">
        <div class="avatar__ring"><img id="photo" alt="" decoding="async"></div>
      </div>

      <!-- 2-4. Имя, должность, био -->
      <h1 class="name reveal" id="name" style="--d:180ms"></h1>
      <p class="role reveal" id="role" style="--d:260ms"></p>
      <p class="bio reveal"  id="bio"  style="--d:340ms"></p>

      <!-- 4b. Преимущества одной строкой (CONFIG.features) -->
      <p class="features reveal" id="features" style="--d:400ms"></p>

      <!-- 5. Разделитель -->

/* ============================================================================
   ЯЗЫК СТРАНИЦЫ
   Выбор запоминается в браузере посетителя. При первом заходе берём язык
   телефона, а если он не из наших — язык по умолчанию.
   ========================================================================== */
const LANG_KEY = 'ot-lang';
let LANG = (function pickLang(){
  const langs = CONFIG.i18n.langs;
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved && langs[saved]) return saved;
  } catch (e) { /* приватный режим — просто идём дальше */ }
  const nav = (navigator.language || '').slice(0, 2).toLowerCase();
  if (langs[nav]) return nav;
  return CONFIG.i18n.fallback;
})();

/** Словарь текущего языка. */
function dict(){
  return CONFIG.i18n.langs[LANG] || CONFIG.i18n.langs[CONFIG.i18n.fallback];
}

/** Смена языка: без перезагрузки, страница просто переписывает свои тексты. */
function setLang(code){
  if (!CONFIG.i18n.langs[code] || code === LANG) return;
  LANG = code;
  try { localStorage.setItem(LANG_KEY, code); } catch (e) { /* не смогли запомнить — не беда */ }
  applyTexts();
}

/* ============================================================================
   ЦВЕТ СТРАНИЦЫ
   Выбор посетителя запоминается так же, как язык. Тема перекрашивает
   CSS-переменные и переключает кнопку контакта на файл с фото в её цвете.
   ========================================================================== */
const THEME_KEY = 'ot-theme';
let THEME = (function pickTheme(){
  try {
    const saved = localStorage.getItem(THEME_KEY);
    const found = CONFIG.themes.find(function(t){ return t.id === saved; });
    if (found) return found;
  } catch (e) { /* приватный режим — берём тему по умолчанию */ }
  return CONFIG.themes[0];
})();

/** '#7C5CFF' -> '124,92,255' — для rgba(var(--accent-rgb), .x) */
function hexRgb(hex){
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(',');
}

/** Файл контакта этой темы: первая — vcfUrl, остальные — vcfUrl с -id. */
function vcfFor(t){
  const url = CONFIG.contacts.vcfUrl;
  return t === CONFIG.themes[0] ? url : url.replace(/\.vcf$/i, '-' + t.id + '.vcf');
}

/** Кружок темы в переключателе: три её цвета; у светлой — белая серединка. */
function swatch(t){
  const ring = 'conic-gradient(' + t.accent + ', ' + t.accent2 + ', ' + t.accent3 + ', ' + t.accent + ')';
  return t.scheme === 'light' ? 'radial-gradient(circle, ' + t.bg2 + ' 0 36%, transparent 40%), ' + ring : ring;
}

/** Перекрашивает страницу в тему t. */
function applyTheme(t){
  const dark = t.scheme !== 'light';
  const vars = {
    '--bg': t.bg, '--bg-2': t.bg2, '--bg-3': t.bg3,
    '--accent': t.accent, '--accent-rgb': hexRgb(t.accent), '--accent-2': t.accent2, '--accent-3': t.accent3,
    '--cta-1': t.cta1, '--cta-2': t.cta2, '--cta-3': t.cta3, '--icon': t.icon || t.accent2,
    '--text': t.text, '--muted': t.muted,
    // светлой теме нужны белые полупрозрачные слои и приглушённые пятна
    '--surface':  dark ? 'rgba(255,255,255,.04)' : 'rgba(255,255,255,.7)',
    '--pill':     dark ? 'rgba(255,255,255,.04)' : 'rgba(255,255,255,.6)',
    '--toast-bg': dark ? 'rgba(20,20,22,.94)' : 'rgba(255,255,255,.95)',
    '--photo-bg': t.bg2,
    '--blob':     dark ? '1' : '.5'
  };
  const root = document.documentElement;
  for (const k in vars) root.style.setProperty(k, vars[k]);
  root.style.colorScheme = dark ? 'dark' : 'light';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = t.bg;

  // «Сохранить контакт» ведёт на файл с фото в рамке этого цвета
  document.querySelectorAll('[data-id="savecontact"]').forEach(function(a){ a.href = vcfFor(t); });

  document.querySelectorAll('#themes button').forEach(function(btn){
    btn.setAttribute('aria-pressed', String(btn.dataset.theme === t.id));
  });
}

/** Смена цвета по нажатию: новая тема расходится кругом от кружка. */
function setTheme(id, from){
  const t = CONFIG.themes.find(function(x){ return x.id === id; });
  if (!t || t === THEME) return;
  THEME = t;
  try { localStorage.setItem(THEME_KEY, id); } catch (e) { /* не смогли запомнить — не беда */ }

  const calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!document.startViewTransition || calm || !from) { applyTheme(t); return; }

  const r = from.getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  const end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const vt = document.startViewTransition(function(){ applyTheme(t); });
  vt.ready.then(function(){
    document.documentElement.animate(
      { clipPath: ['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + end + 'px at ' + x + 'px ' + y + 'px)'] },
      { duration: 700, easing: 'cubic-bezier(.22,.61,.36,1)', pseudoElement: '::view-transition-new(root)' }
    );
  }).catch(function(){ /* анимация не удалась — цвет всё равно уже сменился */ });
}

/** Подставляет все тексты выбранного языка в уже построенную страницу. */
function applyTexts(){
  const d = dict(), b = CONFIG.brand, c = CONFIG.contacts;

  document.documentElement.lang = LANG;
  document.title = d.name + ' — ' + b.name;

  const photo = document.getElementById('photo');
  if (photo) photo.alt = d.name + ' — ' + d.role;

  document.getElementById('name').textContent = d.name;
  document.getElementById('role').textContent = d.role;
  document.getElementById('bio').textContent  = d.bio;

  document.querySelectorAll('.cta span').forEach(function(el){ el.textContent = d.ctaLabel; });

  const note = document.getElementById('ctaNote');
  if (note) {
    if (d.ctaNote) { note.textContent = d.ctaNote; note.hidden = false; }
    else note.hidden = true;
  }

  document.querySelectorAll('#features span').forEach(function(el, i){
    el.textContent = (d.features || [])[i] || '';
  });

  // Подписи круглых кнопок + текст, с которым открывается WhatsApp
  document.querySelectorAll('.links a').forEach(function(a){
    const label = d.actions && d.actions[a.dataset.id];
    if (label) { a.setAttribute('aria-label', label); a.title = label; }
    if (a.dataset.id === 'whatsapp' && c.whatsapp) {
      a.href = c.whatsapp + (d.whatsappText ? '?text=' + encodeURIComponent(d.whatsappText) : '');
    }
  });

  const box = document.getElementById('langs');
  box.setAttribute('aria-label', d.groupLabel);
  box.querySelectorAll('button').forEach(function(btn){
    btn.setAttribute('aria-pressed', String(btn.dataset.lang === LANG));
  });

  const themeBox = document.getElementById('themes');
  themeBox.setAttribute('aria-label', d.themeGroup);
  themeBox.querySelectorAll('button').forEach(function(btn){
    const name = (d.themes || {})[btn.dataset.theme] || btn.dataset.theme;
    btn.setAttribute('aria-label', name); btn.title = name;
  });
}

/* ============================================================================
   РЕНДЕР СТРАНИЦЫ ИЗ КОНФИГА
   ========================================================================== */
(function render(){
  const p = CONFIG.person, b = CONFIG.brand, c = CONFIG.contacts;

  // Контент
  document.getElementById('photo').src = CONFIG.photo.page;

  // Главная кнопка собирается из CONFIG.cta (подпись подставит applyTexts)
  const cta = document.getElementById('ctaBtn');
  cta.href = typeof CONFIG.cta.href === 'function' ? CONFIG.cta.href(c) : CONFIG.cta.href;
  cta.innerHTML = (ICONS[CONFIG.cta.id] || '') + '<span></span>';
  if (/^https?:/i.test(cta.href)) { cta.target = '_blank'; cta.rel = 'noopener noreferrer'; }

  // Каркас строки преимуществ: сколько пунктов в словаре — столько и элементов
  const feat = document.getElementById('features');
  const featCount = (dict().features || []).length;
  if (featCount) {
    for (let i = 0; i < featCount; i++) feat.appendChild(document.createElement('span'));
  } else {
    feat.remove();
  }

  // Название бренда и слоган не переводятся: это фирменные слова
  document.getElementById('brandName').textContent = b.name;
  document.getElementById('tagline').textContent   = b.tagline;

  // Круглые кнопки
  const nav = document.getElementById('links');
  CONFIG.actions.forEach(function(a){
    const href = typeof a.href === 'function' ? a.href(c) : a.href;
    if (!href) return;                       // пункт без данных просто не рисуем
    const el = document.createElement('a');
    el.href = href;
    el.innerHTML = ICONS[a.id] || '';
    el.dataset.id = a.id;
    // внешние ссылки — в новой вкладке; tel:/mailto: — в текущей
    if (/^https?:/i.test(href)) { el.target = '_blank'; el.rel = 'noopener noreferrer'; }
    nav.appendChild(el);
  });
  // Сообщаем CSS фактическое число кнопок — от него считается их размер
  nav.style.setProperty('--n', nav.children.length || 1);

  // Кружки переключения цвета
  const themeBox = document.getElementById('themes');
  CONFIG.themes.forEach(function(t){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.theme = t.id;
    btn.innerHTML = '<i></i>';
    btn.firstChild.style.setProperty('--sw', swatch(t));
    btn.addEventListener('click', function(){ setTheme(t.id, btn); });
    themeBox.appendChild(btn);
  });
  applyTheme(THEME);

  // Кнопки переключения языка
  const langBox = document.getElementById('langs');
  CONFIG.i18n.order.forEach(function(code){
    const d = CONFIG.i18n.langs[code];
    if (!d) return;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.lang = code;
    btn.textContent = d.label;
    btn.addEventListener('click', function(){ setLang(code); });
    langBox.appendChild(btn);
  });

  applyTexts();
})();

/* ============================================================================
   vCard 3.0 — генерация и скачивание
   ========================================================================== */

/** Экранирование спецсимволов значения по RFC 2426. */
function esc(v){
  return String(v == null ? '' : v)
    .replace(/\\/g, '\\\\')
    .replace(/\r?\n/g, '\\n')
    .replace(/,/g, '\\,')
    .replace(/;/g, '\\;');
}

/**
 * Сворачивание длинных строк: не более 75 символов, продолжение — с пробела.
 * Критично для PHOTO (base64): без этого часть парсеров рвёт файл.
 * Строки с не-ASCII не режем, чтобы не разорвать многобайтовый символ.
 */
function fold(line){
  if (line.length <= 75 || /[^\x00-\x7F]/.test(line)) return line;
  const parts = [line.slice(0, 75)];
  for (let i = 75; i < line.length; i += 74) parts.push(' ' + line.slice(i, i + 74));
  return parts.join('\r\n');
}

/** Собирает текст .vcf из CONFIG. */
function buildVCard(){
  const p = CONFIG.person, b = CONFIG.brand, c = CONFIG.contacts, ad = c.address;
  const L = [];

  L.push('BEGIN:VCARD');
  L.push('VERSION:3.0');
  L.push('N:' + esc(p.lastName) + ';' + esc(p.firstName) + ';;;');
  // Имя в списке контактов. Компанию дописываем только если она задана
  L.push('FN:' + esc(p.firstName + ' ' + p.lastName + (p.company ? ' — ' + p.company : '')));

  // Кириллическое написание имени — видно в карточке контакта
  if (p.phoneticFirst) L.push('X-PHONETIC-FIRST-NAME:' + esc(p.phoneticFirst));
  if (p.phoneticLast)  L.push('X-PHONETIC-LAST-NAME:'  + esc(p.phoneticLast));

  // Пустые поля пропускаем: пустая строка в контакте выглядит как брак
  if (p.company) L.push('ORG:' + esc(p.company));
  if (p.title)   L.push('TITLE:' + esc(p.title));
  if (c.phone)   L.push('TEL;TYPE=CELL,VOICE:' + c.phone);
  if (c.email)   L.push('EMAIL;TYPE=INTERNET:' + c.email);
  if (c.website) L.push('URL:' + c.website);  // сайт — основной URL

  // Соцсети: группы item + X-ABLabel, чтобы в телефоне подписи читались словами,
  // а не одинаковым «URL». iOS показывает метку, Android её игнорирует, но ссылку сохраняет.
  [
    ['Telegram',    c.telegram],
    ['WhatsApp',    c.whatsapp],
    ['Instagram',   c.instagram],
    ['Google Maps', c.maps]
  ].filter(function(pair){ return !!pair[1]; })
   .forEach(function(pair, i){
     const g = 'item' + (i + 1);
     L.push(g + '.URL:' + pair[1]);
     L.push(g + '.X-ABLabel:' + esc(pair[0]));
   });

  if (c.instagram) L.push('X-SOCIALPROFILE;TYPE=instagram:' + c.instagram);

  if (ad.street || ad.city || ad.country) {
    L.push('ADR;TYPE=WORK:;;' + esc(ad.street) + ';' + esc(ad.city) + ';' + esc(ad.region) + ';' + esc(ad.zip) + ';' + esc(ad.country));
  }
  if (b.tagline) L.push('NOTE:' + esc(b.tagline));

  // Фото контакта (base64) — самая длинная строка, сворачивается функцией fold()
  if (CONFIG.photo.vcard) L.push('PHOTO;ENCODING=b;TYPE=JPEG:' + CONFIG.photo.vcard);

  L.push('END:VCARD');

  return L.map(fold).join('\r\n') + '\r\n';   // CRLF обязателен по спецификации
}

/* --- Тост --- */
let toastTimer;
function toast(text){
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('is-visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('is-visible'); }, 5200);
}

/**
 * Встроенные браузеры соцсетей (Instagram, Facebook, TikTok и т.п.) часто молча
 * блокируют скачивание файлов — в этом случае подсказываем открыть страницу снаружи.
 */
function isInAppBrowser(){
  const ua = navigator.userAgent || '';
  return /FBAN|FBAV|FB_IAB|Instagram|TikTok|MicroMessenger|Line\//i.test(ua);
}

/**
 * Режим пересборки файла: откройте страницу с ?export в адресе и нажмите кнопку —
 * вместо перехода по ссылке скачается свежий .vcf, собранный из текущего CONFIG.
 * Этот файл кладётся рядом с index.html, и кнопка снова ведёт на него.
 * Нужен только при подготовке визитки, обычный посетитель сюда не попадает.
 */
function exportVCard(){
  const vcf = buildVCard();
  const blob = new Blob([vcf], { type: 'text/vcard;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (CONFIG.ui.vcfFileName || 'contact') + '.vcf';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 4000);
}

/* Поведение кнопок.
   Все они — обычные ссылки, страница в переход не вмешивается: телефон делает
   всё сам. JS добавляет только тактильный отклик, а для контакта — предупреждение
   во встроенных браузерах соцсетей и режим пересборки файла. */
document.querySelectorAll('.cta, .links a').forEach(function(el){
  el.addEventListener('click', function(e){
    if (navigator.vibrate) { try { navigator.vibrate(12); } catch(err){} }

    // всё дальнейшее касается только ссылки на файл контакта
    if (el.dataset.id !== 'savecontact') return;

    if (/(^|[?&])export($|[=&])/.test(location.search)) {
      e.preventDefault();
      exportVCard();
      return;
    }
    if (isInAppBrowser()) toast(dict().toastInApp);
  });
});
