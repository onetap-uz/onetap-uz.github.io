<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<meta name="color-scheme" content="dark">
<title>Porto Bello — оставьте отзыв</title>
<meta name="description" content="Поделитесь впечатлениями о Porto Bello в Google, Яндекс Картах, 2ГИС или Tripadvisor.">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* ============================================================
   PORTO BELLO — страница «оставьте отзыв».
   Одна задача: за один тап довести гостя до формы отзыва.
   Ссылки и тексты — в объекте CONFIG ниже.
   ============================================================ */
:root{
  --bg:#0B0B0C; --bg-2:#141416;
  --gold:#C9A227; --gold-soft:#E8D9A8;
  --text:#F4F1EA; --muted:#9A948A;
  --line:rgba(201,162,39,.28);
  --surface:rgba(255,255,255,.035);
  --surface-line:rgba(232,217,168,.18);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ min-height:100%; }
body{
  margin:0;
  background:
    radial-gradient(120% 70% at 50% -10%, #1C1B19 0%, transparent 60%),
    linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 45%, #08080A 100%);
  background-attachment:fixed;
  color:var(--text);
  font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}

.page{
  position:relative;
  min-height:100vh; min-height:100svh;
  max-width:460px; margin-inline:auto;
  display:flex; flex-direction:column; justify-content:center;
  padding:
    calc(env(safe-area-inset-top, 0px) + 56px)
    20px
    calc(env(safe-area-inset-bottom, 0px) + 28px);
}

/* ---------- Переключатель языка ---------- */
.langs{
  position:absolute; z-index:3;
  top:calc(env(safe-area-inset-top, 0px) + 12px); right:16px;
  display:flex; gap:2px; padding:3px;
  border:1px solid var(--surface-line); border-radius:100px;
  background:rgba(255,255,255,.03);
}
.langs button{
  border:0; background:none; cursor:pointer;
  padding:5px 10px; border-radius:100px;
  color:var(--muted);
  font:500 10px/1 'Inter', sans-serif; letter-spacing:.09em; text-transform:uppercase;
  transition:color .2s var(--ease), background .2s var(--ease), transform .15s var(--ease);
}
.langs button[aria-pressed="true"]{ background:rgba(201,162,39,.16); color:var(--gold); }
.langs button:active{ transform:scale(.92); }
.langs button:focus-visible{ outline:2px solid var(--gold-soft); outline-offset:2px; }

/* ---------- Шапка ---------- */
.head{ text-align:center; margin-bottom:clamp(26px, 5vh, 38px); }
.stars{ display:flex; justify-content:center; gap:6px; margin-bottom:18px; color:var(--gold); }
.stars svg{ width:15px; height:15px; }
.brand{
  margin:0;
  font-family:'Cinzel', Georgia, serif; font-weight:500;
  font-size:clamp(24px, 7vw, 30px);
  letter-spacing:.16em; text-indent:.16em;
  color:var(--gold);
}
.divider{ display:flex; align-items:center; justify-content:center; gap:10px; width:150px; margin:16px auto 20px; }
.divider span{ flex:1; height:1px; background:linear-gradient(90deg, transparent, var(--line)); }
.divider span:last-child{ background:linear-gradient(90deg, var(--line), transparent); }
.divider i{ width:5px; height:5px; rotate:45deg; background:var(--gold); opacity:.85; }
h1{
  margin:0 0 10px;
  font-family:'Cinzel', Georgia, serif; font-weight:500;
  font-size:clamp(19px, 5.4vw, 23px); letter-spacing:.02em;
}
.sub{ margin:0 auto; max-width:32ch; color:var(--muted); font-size:14px; line-height:1.6; }

/* ---------- Кнопки площадок ---------- */
.list{ display:flex; flex-direction:column; gap:12px; }
.item{
  display:flex; align-items:center; gap:14px;
  min-height:66px; padding:12px 16px 12px 12px;
  border:1px solid var(--surface-line); border-radius:16px;
  background:var(--surface);
  color:var(--text); text-decoration:none;
  transition:transform .16s var(--ease), border-color .25s var(--ease), background .25s var(--ease);
}
.item:active{ transform:scale(.975); border-color:var(--gold); background:rgba(201,162,39,.08); }
.item:focus-visible{ outline:2px solid var(--gold-soft); outline-offset:3px; }
@media (hover:hover){ .item:hover{ border-color:var(--gold); } }

/* Буква площадки в тонком золотом кольце — единый стиль вместо чужих логотипов */
.badge{
  flex:none; display:grid; place-items:center;
  width:42px; height:42px; border-radius:50%;
  border:1px solid var(--line);
  font-family:'Cinzel', Georgia, serif; font-weight:600; font-size:16px;
  color:var(--gold);
}
.label{ flex:1; min-width:0; }
.label b{ display:block; font-weight:500; font-size:15.5px; letter-spacing:.01em; }
.label small{ display:block; margin-top:2px; color:var(--muted); font-size:12px; }
.arrow{ flex:none; width:18px; height:18px; color:var(--gold); opacity:.8; }

.foot{ margin-top:clamp(26px, 5vh, 40px); text-align:center; color:var(--muted); font-size:12px; opacity:.75; }

/* ---------- Появление ---------- */
.reveal{ opacity:0; animation:rise .8s var(--ease) forwards; animation-delay:var(--d, 0ms); }
@keyframes rise{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }
@media (prefers-reduced-motion:reduce){
  .reveal{ animation:none; opacity:1; }
  *{ transition-duration:.01ms !important; }
}
</style>
</head>
<body>
  <main class="page">
    <div class="langs" id="langs" role="group"></div>

    <header class="head">
      <div class="stars reveal" aria-hidden="true" style="--d:40ms" id="stars"></div>
      <p class="brand reveal" style="--d:120ms">PORTO BELLO</p>
      <div class="divider reveal" aria-hidden="true" style="--d:180ms"><span></span><i></i><span></span></div>
      <h1 class="reveal" id="title" style="--d:240ms"></h1>
      <p class="sub reveal" id="sub" style="--d:300ms"></p>
    </header>

    <nav class="list" id="list"></nav>

    <p class="foot reveal" id="foot" style="--d:720ms"></p>
  </main>

<script>
/* ============================================================================
   КОНФИГУРАЦИЯ. Ссылки на площадки и тексты на двух языках.
   ========================================================================== */
const CONFIG = {
  platforms: [
    { id:'google',      badge:'G',  url:'https://g.page/r/CfdprlLUQFm2EBM/review' },
    { id:'yandex',      badge:'Я',  url:'https://yandex.uz/maps/-/CTtDFKkL' },
    { id:'2gis',        badge:'2',  url:'https://2gis.uz/tashkent/reviews/70000001063186863/addReview?utm_source=lk' },
    { id:'tripadvisor', badge:'T',  url:'https://www.tripadvisor.com/UserReviewEdit-d24084649?m=68676' }
  ],
  fallback: 'ru',
  order: ['ru', 'en'],
  langs: {
    ru: {
      label:'RU', groupLabel:'Язык',
      docTitle:'Porto Bello — оставьте отзыв',
      title:'Поделитесь впечатлениями',
      sub:'Выберите удобную площадку — это займёт минуту. Спасибо, что выбрали нас!',
      foot:'Каждый отзыв мы читаем лично',
      names:{ google:'Google', yandex:'Яндекс Карты', '2gis':'2ГИС', tripadvisor:'Tripadvisor' },
      hints:{ google:'Отзыв в Google Картах', yandex:'Отзыв на Яндекс Картах', '2gis':'Отзыв в 2ГИС', tripadvisor:'Для гостей со всего мира' }
    },
    en: {
      label:'EN', groupLabel:'Language',
      docTitle:'Porto Bello — leave a review',
      title:'Share your experience',
      sub:'Pick any platform — it only takes a minute. Thank you for choosing us!',
      foot:'We read every review personally',
      names:{ google:'Google', yandex:'Yandex Maps', '2gis':'2GIS', tripadvisor:'Tripadvisor' },
      hints:{ google:'Review on Google Maps', yandex:'Review on Yandex Maps', '2gis':'Review on 2GIS', tripadvisor:'Trusted by travellers worldwide' }
    }
  }
};

/* ---------- Язык: сохранённый выбор → язык телефона → русский ---------- */
const LANG_KEY = 'pbr-lang';
let LANG = (function(){
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved && CONFIG.langs[saved]) return saved;
  } catch (e) { /* приватный режим */ }
  // Русский и узбекский телефон — русская версия, остальные — английская
  const nav = (navigator.language || '').slice(0, 2).toLowerCase();
  return (nav === 'ru' || nav === 'uz' || nav === 'kk' || nav === 'ky' || nav === 'tg') ? 'ru' : 'en';
})();
function dict(){ return CONFIG.langs[LANG] || CONFIG.langs[CONFIG.fallback]; }

const STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2.7 5.9 6.4.7-4.8 4.3 1.3 6.3L12 16.9 6.4 20l1.3-6.3L2.9 9.4l6.4-.7z"/></svg>';
const ARROW = '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6.5 18.5 12 13 17.5"/></svg>';

/* ---------- Сборка страницы ---------- */
(function build(){
  document.getElementById('stars').innerHTML = STAR.repeat(5);

  const list = document.getElementById('list');
  CONFIG.platforms.forEach(function(p, i){
    const a = document.createElement('a');
    a.className = 'item reveal';
    a.style.setProperty('--d', (380 + i * 80) + 'ms');
    a.href = p.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.dataset.id = p.id;
    // клик по площадке считается в статистике отдельно: видно, куда идут гости
    a.setAttribute('data-goatcounter-click', 'review-' + p.id);
    a.innerHTML = '<span class="badge"></span><span class="label"><b></b><small></small></span>' + ARROW;
    a.querySelector('.badge').textContent = p.badge;
    list.appendChild(a);
  });

  const box = document.getElementById('langs');
  CONFIG.order.forEach(function(code){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.lang = code;
    btn.textContent = CONFIG.langs[code].label;
    btn.addEventListener('click', function(){ setLang(code); });
    box.appendChild(btn);
  });

  applyTexts();
})();

function setLang(code){
  if (!CONFIG.langs[code] || code === LANG) return;
  LANG = code;
  try { localStorage.setItem(LANG_KEY, code); } catch (e) {}
  applyTexts();
}

function applyTexts(){
  const d = dict();
  document.documentElement.lang = LANG;
  document.title = d.docTitle;
  document.getElementById('title').textContent = d.title;
  document.getElementById('sub').textContent   = d.sub;
  document.getElementById('foot').textContent  = d.foot;
  document.querySelectorAll('.item').forEach(function(a){
    a.querySelector('b').textContent     = d.names[a.dataset.id];
    a.querySelector('small').textContent = d.hints[a.dataset.id];
    a.setAttribute('aria-label', d.names[a.dataset.id] + ' — ' + d.hints[a.dataset.id]);
  });
  const box = document.getElementById('langs');
  box.setAttribute('aria-label', d.groupLabel);
  box.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)); });
}
</script>

<!-- Счётчик: сколько гостей открыли страницу и на какую площадку нажали -->
<script data-goatcounter="https://m1ran21.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
