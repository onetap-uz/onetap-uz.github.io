<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<meta name="color-scheme" content="dark">
<title>Нозима Жумадуллаева — Porto Bello Tour</title>
<meta name="description" content="Цифровая визитка. Нозима Жумадуллаева — Founder &amp; Travel Consultant, Porto Bello Tour. Сохраните контакт в один тап.">
<meta property="og:type" content="profile">
<meta property="og:title" content="Нозима Жумадуллаева — Porto Bello Tour">
<meta property="og:description" content="Ваш персональный эксперт по путешествиям — от идеи поездки до возвращения домой.">
<meta property="og:url" content="https://portobellotour.uz">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* ============================================================
   PORTO BELLO TOUR — NFC digital business card
   Тема: тёмный графит + золото. Mobile-first, первый экран без скролла.
   Все данные и цвета настраиваются в объекте CONFIG (ниже, в <script>).
   ============================================================ */

/* --- Дизайн-токены. Цвета перезаписываются из CONFIG.theme при загрузке --- */
:root{
  --bg:            #0B0B0C;   /* глубокий графит — база */
  --bg-2:          #141416;   /* верхняя точка градиента */
  --gold:          #C9A227;   /* основное золото бренда */
  --gold-soft:     #E8D9A8;   /* шампань-золото (блик) */
  --gold-deep:     #8B6F1E;   /* тёмное золото (тень градиента) */
  --text:          #F4F1EA;   /* основной текст */
  --muted:         #9A948A;   /* вторичный текст */
  --line:          rgba(201,162,39,.28);   /* тонкие линии */
  --surface:       rgba(255,255,255,.035); /* фон круглых кнопок */
  --surface-line:  rgba(232,217,168,.20);

  --ease: cubic-bezier(.22,.61,.36,1);
}

*,*::before,*::after{ box-sizing:border-box; }

html{ scroll-behavior:smooth; }        /* плавный переход по стрелке «листайте» */
html,body{ min-height:100%; }

body{
  margin:0;
  background:
    radial-gradient(120% 80% at 50% -10%, #1A1A1D 0%, transparent 60%),
    linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 42%, #08080A 100%);
  background-attachment:fixed;
  color:var(--text);
  font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}

/* --- Каркас: одна колонка на всю высоту экрана (svh — без скачков в мобильных браузерах) --- */
.card{
  position:relative;
  min-height:100vh;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  padding:
    calc(env(safe-area-inset-top, 0px) + clamp(16px, 3vh, 32px))
    20px
    calc(env(safe-area-inset-bottom, 0px) + clamp(14px, 2.4vh, 26px));
  max-width:520px;
  margin-inline:auto;
}

/* Мягкое золотое свечение за фотографией (ширина ограничена шириной карточки,
   иначе на узких экранах появляется горизонтальный скролл) */
.glow{
  position:absolute; top:-6%; left:50%; translate:-50% 0;
  width:min(560px, 100%); aspect-ratio:1;
  background:radial-gradient(circle, rgba(201,162,39,.16) 0%, rgba(201,162,39,.05) 38%, transparent 68%);
  pointer-events:none; z-index:0;
}

.hero{
  position:relative; z-index:1;
  flex:1 1 auto;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  width:100%;
  text-align:center;
}

/* ---------- 1. Круглое фото в тонкой золотой рамке ---------- */
.avatar{
  position:relative;
  width:clamp(114px, 33vw, 156px);
  aspect-ratio:1;
  margin-bottom:clamp(18px, 3.2vh, 28px);
}
/* внешнее тонкое кольцо — держится на расстоянии от фото */
.avatar::after{
  content:''; position:absolute; inset:-9px;
  border-radius:50%;
  border:1px solid var(--line);
}
.avatar__ring{                       /* золотая рамка-градиент */
  width:100%; height:100%;
  border-radius:50%;
  padding:2px;
  background:linear-gradient(150deg, var(--gold-soft) 0%, var(--gold) 38%, var(--gold-deep) 62%, var(--gold-soft) 100%);
  box-shadow:0 18px 44px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.35);
}
.avatar__ring img{
  display:block; width:100%; height:100%;
  border-radius:50%;
  object-fit:cover;
  background:#1a1a1d;
}

/* ---------- 2. Имя ---------- */
.name{
  margin:0;
  font-family:'Playfair Display', Georgia, 'Times New Roman', serif;
  font-weight:500;
  font-size:clamp(25px, 7.4vw, 33px);
  line-height:1.18;
  letter-spacing:.005em;
}

/* ---------- 3. Должность ---------- */
.role{
  margin:clamp(9px, 1.6vh, 13px) 0 0;
  color:var(--gold);
  font-size:clamp(9.5px, 2.7vw, 11px);
  font-weight:400;
  text-transform:uppercase;
  letter-spacing:.26em;
  text-indent:.26em;            /* компенсируем разрядку последней буквы */
}

/* ---------- 4. Bio ---------- */
.bio{
  margin:clamp(12px, 2.2vh, 18px) 0 0;
  max-width:31ch;
  color:var(--muted);
  font-size:clamp(12.5px, 3.5vw, 14px);
  line-height:1.62;
}

/* ---------- 5. Тонкий золотой разделитель ---------- */
.divider{
  display:flex; align-items:center; justify-content:center; gap:10px;
  width:min(210px, 62%);
  margin:clamp(16px, 3vh, 28px) 0;
}
.divider span{
  flex:1; height:1px;
  background:linear-gradient(90deg, transparent, var(--line));
}
.divider span:last-child{ background:linear-gradient(90deg, var(--line), transparent); }
.divider i{
  width:5px; height:5px; rotate:45deg;
  background:var(--gold);
  opacity:.85;
}

/* ---------- 6. Главная кнопка ---------- */
.cta{
  display:flex; align-items:center; justify-content:center; gap:10px;
  width:100%; max-width:340px;
  min-height:clamp(52px, 7.2vh, 58px);
  padding:0 22px;
  border:0; border-radius:100px;
  background:linear-gradient(135deg, var(--gold-soft) 0%, var(--gold) 52%, #B08D1C 100%);
  color:#14110A;
  text-decoration:none;              /* кнопка — это ссылка <a> на .vcf */
  font-family:'Inter', sans-serif;
  font-size:clamp(14px, 4vw, 15.5px);
  font-weight:500;
  letter-spacing:.035em;
  cursor:pointer;
  box-shadow:0 12px 30px rgba(201,162,39,.24), 0 2px 6px rgba(0,0,0,.4);
  transition:transform .18s var(--ease), box-shadow .25s var(--ease), filter .2s var(--ease);
}
.cta svg{ width:18px; height:18px; flex:none; }
.cta:active{                       /* тактильный отклик на нажатие */
  transform:scale(.965);
  box-shadow:0 6px 16px rgba(201,162,39,.20);
  filter:brightness(.97);
}
.cta:focus-visible{ outline:2px solid var(--gold-soft); outline-offset:3px; }

/* ---------- 7. Ряд круглых иконок ----------
   Размер кнопки вычисляется из ширины ряда и их количества (--n задаётся из JS),
   поэтому иконки всегда помещаются в одну строку — от 320px и шире. */
.links{
  --n:7;                       /* переопределяется в render() */
  --gap:clamp(6px, 2vw, 12px);
  display:flex; flex-wrap:nowrap; align-items:center; justify-content:center;
  gap:var(--gap);
  margin-top:clamp(18px, 3.2vh, 28px);
  width:100%;
}
.links a{
  display:grid; place-items:center;
  flex:0 0 auto;
  width:min(50px, calc((100% - (var(--n) - 1) * var(--gap)) / var(--n)));
  aspect-ratio:1;
  border-radius:50%;
  border:1px solid var(--surface-line);
  background:var(--surface);
  color:var(--gold-soft);
  text-decoration:none;
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  transition:transform .18s var(--ease), border-color .25s var(--ease), background .25s var(--ease), color .25s var(--ease);
}
.links a svg{ width:clamp(17px, 4.6vw, 20px); height:auto; }
.links a:active{
  transform:scale(.9);
  background:rgba(201,162,39,.14);
  border-color:var(--gold);
  color:#fff;
}
.links a:focus-visible{ outline:2px solid var(--gold-soft); outline-offset:3px; }
@media (hover:hover){
  .links a:hover{ border-color:var(--gold); background:rgba(201,162,39,.10); }
  .cta:hover{ box-shadow:0 16px 36px rgba(201,162,39,.3); }
}

/* ---------- 8. Подвал: логотип и слоган ---------- */
.foot{
  position:relative; z-index:1;
  flex:0 0 auto;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  padding-top:clamp(14px, 2.6vh, 22px);
  text-align:center;
}
.foot .mark{
  width:34px; height:1px;
  background:linear-gradient(90deg, transparent, var(--line), transparent);
  margin-bottom:4px;
}
.logo{
  font-family:'Playfair Display', Georgia, serif;
  font-weight:500;
  font-size:clamp(13px, 3.6vw, 15px);
  letter-spacing:.2em; text-indent:.2em;
  text-transform:uppercase;
  color:var(--gold);
}
.tagline{
  margin:0;
  font-family:'Playfair Display', Georgia, serif;
  font-style:italic;
  font-size:clamp(11.5px, 3.2vw, 13px);
  letter-spacing:.02em;
  color:var(--muted);
  opacity:.8;
}

/* ---------- Переключатель языка ---------- */
.langs{
  position:absolute; z-index:3;
  top:calc(env(safe-area-inset-top, 0px) + 10px);
  right:16px;
  display:flex; gap:2px;
  padding:3px;
  border:1px solid var(--surface-line);
  border-radius:100px;
  background:rgba(255,255,255,.03);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
}
.langs button{
  border:0; background:none; cursor:pointer;
  padding:5px 9px;
  border-radius:100px;
  color:var(--muted);
  font-family:'Inter', sans-serif;
  font-size:10px; font-weight:500;
  letter-spacing:.09em; text-transform:uppercase;
  transition:color .2s var(--ease), background .2s var(--ease), transform .15s var(--ease);
}
.langs button[aria-pressed="true"]{
  background:rgba(201,162,39,.16);
  color:var(--gold);
}
.langs button:active{ transform:scale(.92); }
.langs button:focus-visible{ outline:2px solid var(--gold-soft); outline-offset:2px; }

/* ---------- Стрелка «листайте дальше» ---------- */
.scroll-hint{
  display:grid; place-items:center;
  width:32px; height:32px;
  margin-top:clamp(6px, 1.2vh, 12px);
  color:var(--gold); opacity:.7;
  animation:bob 2.1s ease-in-out infinite;
}
.scroll-hint svg{ width:16px; height:16px; }
@keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(5px); } }

/* ---------- Вторая секция: маршрут с остановками ---------- */
.routes{
  position:relative; z-index:1;
  max-width:520px; margin-inline:auto;
  padding:clamp(38px, 7vh, 70px) 20px 0;
}
.sec-head{ text-align:center; margin-bottom:clamp(24px, 4vh, 38px); }
.sec-kicker{
  display:block;
  color:var(--gold);
  font-size:clamp(9.5px, 2.7vw, 10.5px);
  text-transform:uppercase; letter-spacing:.26em; text-indent:.26em;
  margin-bottom:9px;
}
.sec-title{
  margin:0;
  font-family:'Playfair Display', Georgia, serif;
  font-weight:500;
  font-size:clamp(21px, 5.8vw, 27px);
  line-height:1.25;
}

/* Пунктирная нить слева и ромбы-остановки на ней */
.route{ list-style:none; margin:0; padding:0 0 0 30px; position:relative; }
.route::before{
  content:''; position:absolute; left:6px; top:10px; bottom:10px;
  width:1px;
  background:repeating-linear-gradient(to bottom, var(--line) 0 5px, transparent 5px 11px);
}
.route li{
  position:relative;
  margin-bottom:clamp(16px, 2.8vh, 26px);
  opacity:0; transform:translateY(18px);
  transition:opacity .7s var(--ease), transform .7s var(--ease);
}
.route li:last-child{ margin-bottom:0; }
.route li.is-in{ opacity:1; transform:none; }
.route li::before{                 /* точка остановки поверх нити */
  content:''; position:absolute; left:-28px; top:18px;
  width:8px; height:8px; rotate:45deg;
  background:var(--gold);
  box-shadow:0 0 0 4px var(--bg), 0 0 12px rgba(201,162,39,.75);
}

.stop{
  position:relative; display:block;
  margin:0;                          /* у figure свой отступ в браузере — снимаем */
  border-radius:16px; overflow:hidden;
  border:1px solid var(--surface-line);
  aspect-ratio:16/10;
  background:#141416;
  box-shadow:0 14px 32px rgba(0,0,0,.45);
}
.stop img{
  display:block; width:100%; height:100%;
  object-fit:cover;
}
.stop::after{                      /* затемнение под подписью */
  content:''; position:absolute; inset:0;
  background:linear-gradient(to top, rgba(6,6,9,.9) 0%, rgba(6,6,9,.3) 42%, transparent 68%);
}
.stop b{
  position:absolute; left:15px; bottom:12px; z-index:1;
  font-family:'Playfair Display', Georgia, serif;
  font-weight:500;
  font-size:clamp(16px, 4.4vw, 19px);
  letter-spacing:.01em;
}
.stop small{
  position:absolute; right:15px; bottom:16px; z-index:1;
  color:var(--gold);
  font-size:clamp(9px, 2.5vw, 10px);
  text-transform:uppercase; letter-spacing:.18em;
}

/* ---------- Отзывы ---------- */
.reviews{
  position:relative; z-index:1;
  max-width:520px; margin-inline:auto;
  padding:clamp(38px, 7vh, 66px) 20px 0;
}
.rev-list{ display:flex; flex-direction:column; gap:clamp(11px, 2vh, 16px); }
.rev{
  position:relative;
  margin:0;
  padding:17px 18px 15px;
  border:1px solid var(--surface-line);
  border-radius:16px;
  background:rgba(255,255,255,.028);
  opacity:0; transform:translateY(16px);
  transition:opacity .7s var(--ease), transform .7s var(--ease);
}
.rev.is-in{ opacity:1; transform:none; }
.rev::before{                      /* декоративная кавычка */
  content:'”';
  position:absolute; top:0; right:16px;
  font-family:'Playfair Display', Georgia, serif;
  font-size:50px; line-height:1;
  color:var(--gold); opacity:.2;
  pointer-events:none;
}
.rev blockquote{
  margin:0 0 11px;
  font-size:clamp(12.5px, 3.4vw, 13.5px);
  line-height:1.6;
  color:var(--text); opacity:.92;
}
.rev figcaption{ display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 9px; }
.rev b{
  color:var(--gold);
  font-size:clamp(10px, 2.8vw, 11px);
  font-weight:500;
  text-transform:uppercase; letter-spacing:.14em;
}
.rev small{ color:var(--muted); font-size:clamp(10px, 2.8vw, 11px); }

/* ---------- Кнопка «поделиться» ---------- */
.share{
  display:inline-flex; align-items:center; justify-content:center; gap:9px;
  margin-top:clamp(10px, 1.8vh, 15px);
  padding:12px 22px;
  border:1px solid var(--surface-line);
  border-radius:100px;
  background:rgba(255,255,255,.03);
  color:var(--text);
  font-family:'Inter', sans-serif;
  font-size:clamp(12.5px, 3.4vw, 13.5px);
  text-decoration:none; cursor:pointer;
  transition:transform .18s var(--ease), border-color .25s var(--ease), color .25s var(--ease);
}
.share svg{ width:16px; height:16px; flex:none; }
.share:active{ transform:scale(.96); border-color:var(--gold); color:var(--gold-soft); }
.share:focus-visible{ outline:2px solid var(--gold-soft); outline-offset:3px; }
@media (hover:hover){ .share:hover{ border-color:var(--gold); } }

/* ---------- Закрывающий блок ---------- */
.outro{
  position:relative; z-index:1;
  display:flex; flex-direction:column; align-items:center;
  max-width:520px; margin-inline:auto;
  padding:clamp(32px, 6vh, 58px) 20px calc(env(safe-area-inset-bottom, 0px) + 32px);
  text-align:center;
}
.outro-text{
  margin:0 0 clamp(16px, 2.6vh, 24px);
  max-width:28ch;
  color:var(--muted);
  font-size:clamp(12.5px, 3.5vw, 14px);
  line-height:1.6;
}

/* ---------- Подпись-ссылка «хотите такую же визитку» ---------- */
.promo{
  display:inline-flex; align-items:center; gap:7px;
  margin-top:clamp(8px, 1.4vh, 13px);
  padding:7px 15px;
  border:1px solid var(--surface-line);
  border-radius:100px;
  background:rgba(255,255,255,.03);
  color:var(--muted);
  font-size:clamp(10.5px, 2.9vw, 11.5px);
  letter-spacing:.02em;
  text-decoration:none;
  transition:transform .18s var(--ease), border-color .25s var(--ease), color .25s var(--ease);
}
.promo svg{ width:12px; height:12px; flex:none; opacity:.8; }
.promo:active{ transform:scale(.95); border-color:var(--gold); color:var(--gold-soft); }
.promo:focus-visible{ outline:2px solid var(--gold-soft); outline-offset:3px; }
@media (hover:hover){ .promo:hover{ border-color:var(--gold); color:var(--gold-soft); } }

/* ---------- Уведомление (тост) ---------- */
.toast{
  position:fixed; left:50%; translate:-50% 0;
  bottom:calc(env(safe-area-inset-bottom, 0px) + 88px);   /* выше подвала, чтобы не перекрывать логотип */
  z-index:20;
  max-width:min(360px, calc(100vw - 40px));
  padding:11px 18px;
  border-radius:100px;
  border:1px solid var(--surface-line);
  background:rgba(20,20,22,.94);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  box-shadow:0 12px 34px rgba(0,0,0,.5);
  color:var(--text);
  font-size:12.5px; line-height:1.45; text-align:center;
  opacity:0; visibility:hidden; transform:translateY(10px);
  transition:opacity .3s var(--ease), transform .3s var(--ease), visibility .3s;
}
.toast.is-visible{ opacity:1; visibility:visible; transform:translateY(0); }

/* ---------- Плавное появление при загрузке ---------- */
.reveal{
  opacity:0;
  animation:rise .85s var(--ease) forwards;
  animation-delay:var(--d, 0ms);
}
@keyframes rise{
  from{ opacity:0; transform:translateY(16px); }
  to  { opacity:1; transform:translateY(0); }
}
/* Фото появляется мягче — с лёгким приближением */
.avatar.reveal{ animation-name:riseScale; animation-duration:1.1s; }
@keyframes riseScale{
  from{ opacity:0; transform:translateY(10px) scale(.9); }
  to  { opacity:1; transform:translateY(0) scale(1); }
}

@media (prefers-reduced-motion:reduce){
  html{ scroll-behavior:auto; }
  .reveal{ animation:none; opacity:1; }
  .scroll-hint{ animation:none; }
  .route li, .rev{ opacity:1; transform:none; }   /* блоки видны без прокрутки */
  *{ transition-duration:.01ms !important; }
}

/* Низкие экраны (iPhone SE и подобные) — ужимаем вертикаль */
@media (max-height:680px){
  .avatar{ width:clamp(100px, 27vw, 120px); margin-bottom:14px; }
  .bio{ font-size:12.5px; }
  .divider{ margin:14px 0; }
  .links{ margin-top:16px; }
}
</style>
</head>

<body>
  <main class="card">
    <div class="glow" aria-hidden="true"></div>

    <!-- Переключатель языка (CONFIG.i18n) -->
    <div class="langs" id="langs" role="group"></div>

    <section class="hero">
      <!-- 1. Фото -->
      <div class="avatar reveal" style="--d:60ms">
        <div class="avatar__ring"><img id="photo" alt="" decoding="async"></div>
      </div>

      <!-- 2-4. Имя, должность, био -->
      <h1 class="name reveal" id="name" style="--d:180ms"></h1>
      <p class="role reveal" id="role" style="--d:260ms"></p>
      <p class="bio reveal"  id="bio"  style="--d:340ms"></p>

      <!-- 5. Разделитель -->
      <div class="divider reveal" style="--d:420ms" aria-hidden="true"><span></span><i></i><span></span></div>

      <!-- 6. Главная кнопка. Что именно на ней — задаётся в CONFIG.cta:
           иконка, подпись и ссылка. Содержимое подставляется из конфига. -->
      <a class="cta reveal" id="ctaBtn" href="#" style="--d:500ms"></a>

      <!-- 7. Круглые иконки-ссылки (генерируются из CONFIG.actions) -->
      <nav class="links reveal" id="links" style="--d:580ms" aria-label="Контакты"></nav>
    </section>

    <!-- 8. Подвал -->
    <footer class="foot reveal" style="--d:680ms">

/* ============================================================================
   ЯЗЫК СТРАНИЦЫ
   Выбор запоминается в браузере посетителя. При первом заходе берём язык
   телефона, а если он не из наших — язык по умолчанию.
   ========================================================================== */
const LANG_KEY = 'pb-lang';
let LANG = (function pickLang(){
  const langs = CONFIG.i18n.langs;
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved && langs[saved]) return saved;
  } catch (e) { /* приватный режим — просто идём дальше */ }
  const nav = (navigator.language || '').slice(0, 2).toLowerCase();
  if (langs[nav]) return nav;
  return CONFIG.i18n.fallback;
})();

/** Словарь текущего языка. */
function dict(){
  return CONFIG.i18n.langs[LANG] || CONFIG.i18n.langs[CONFIG.i18n.fallback];
}

/** Смена языка: без перезагрузки, страница просто переписывает свои тексты. */
function setLang(code){
  if (!CONFIG.i18n.langs[code] || code === LANG) return;
  LANG = code;
  try { localStorage.setItem(LANG_KEY, code); } catch (e) { /* не смогли запомнить — не беда */ }
  applyTexts();
}

/** Подставляет все тексты выбранного языка в уже построенную страницу. */
function applyTexts(){
  const d = dict(), b = CONFIG.brand, c = CONFIG.contacts;

  document.documentElement.lang = LANG;
  document.title = d.name + ' — ' + b.name;

  const photo = document.getElementById('photo');
  if (photo) photo.alt = d.name + ' — ' + d.role;

  document.getElementById('name').textContent = d.name;
  document.getElementById('role').textContent = d.role;
  document.getElementById('bio').textContent  = d.bio;

  document.querySelectorAll('.cta span').forEach(function(el){ el.textContent = d.ctaLabel; });

  // Подписи круглых кнопок + текст, с которым открывается WhatsApp
  document.querySelectorAll('.links a').forEach(function(a){
    const label = d.actions && d.actions[a.dataset.id];
    if (label) { a.setAttribute('aria-label', label); a.title = label; }
    if (a.dataset.id === 'whatsapp' && c.whatsapp) {
      a.href = c.whatsapp + (d.whatsappText ? '?text=' + encodeURIComponent(d.whatsappText) : '');
    }
  });

  const hint = document.querySelector('.scroll-hint');
  if (hint) hint.setAttribute('aria-label', d.scrollAria);

  const rk = document.getElementById('routesKicker');
  if (rk) {
    rk.textContent = d.routesKicker;
    document.getElementById('routesTitle').textContent = d.routesTitle;
    document.querySelectorAll('.route li').forEach(function(li, i){
      const city = (d.cities || [])[i];
      if (!city) return;
      li.querySelector('b').textContent     = city.city;
      li.querySelector('small').textContent = city.note || '';
      li.querySelector('img').alt           = city.city;
    });
  }

  const vk = document.getElementById('revKicker');
  if (vk) {
    vk.textContent = d.revKicker;
    document.getElementById('revTitle').textContent = d.revTitle;
    document.querySelectorAll('.rev').forEach(function(fig, i){
      const r = (d.reviews || [])[i];
      if (!r) return;
      fig.querySelector('blockquote').textContent = r.text;
      fig.querySelector('b').textContent          = r.name;
      fig.querySelector('small').textContent      = r.trip || '';
    });
  }

  const outro = document.getElementById('outroText');
  if (outro) outro.textContent = d.outro;

  const shareSpan = document.querySelector('#shareBtn span');
  if (shareSpan) shareSpan.textContent = d.share;

  const promoSpan = document.querySelector('#promo span');
  if (promoSpan) promoSpan.textContent = d.promo;

  const box = document.getElementById('langs');
  box.setAttribute('aria-label', d.groupLabel);
  box.querySelectorAll('button').forEach(function(btn){
    btn.setAttribute('aria-pressed', String(btn.dataset.lang === LANG));
  });
}

/**
 * Проявление блоков по мере прокрутки. Если IntersectionObserver недоступен,
 * показываем всё сразу: страница не должна остаться пустой ни при каких условиях.
 */
function revealOnScroll(nodes){
  if (!('IntersectionObserver' in window)) {
    nodes.forEach(function(n){ n.classList.add('is-in'); });
    return;
  }
  const io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); }
    });
  }, { rootMargin: '0px 0px -12% 0px' });
  nodes.forEach(function(n){ io.observe(n); });
}

/* ============================================================================
   РЕНДЕР СТРАНИЦЫ ИЗ КОНФИГА
   ========================================================================== */
(function render(){
  const t = CONFIG.theme, p = CONFIG.person, b = CONFIG.brand, c = CONFIG.contacts;

  // Цвета -> CSS-переменные
  const root = document.documentElement.style;
  root.setProperty('--bg',        t.bg);
  root.setProperty('--bg-2',      t.bg2);
  root.setProperty('--gold',      t.gold);
  root.setProperty('--gold-soft', t.goldSoft);
  root.setProperty('--gold-deep', t.goldDeep);
  root.setProperty('--text',      t.text);
  root.setProperty('--muted',     t.muted);

  // Контент
  document.getElementById('photo').src = CONFIG.photo.page;

  // Главная кнопка собирается из CONFIG.cta (подпись подставит applyTexts)
  const cta = document.getElementById('ctaBtn');
  cta.href = typeof CONFIG.cta.href === 'function' ? CONFIG.cta.href(c) : CONFIG.cta.href;
  cta.innerHTML = (ICONS[CONFIG.cta.id] || '') + '<span></span>';
  if (/^https?:/i.test(cta.href)) { cta.target = '_blank'; cta.rel = 'noopener noreferrer'; }

  // Название бренда и слоган не переводятся: это фирменные слова
  document.getElementById('brandName').textContent = b.name;
  document.getElementById('tagline').textContent   = b.tagline;

  // Та же кнопка внизу страницы: прокрутив маршрут, человек не должен
  // возвращаться наверх, чтобы написать
  const cta2 = document.getElementById('ctaBtn2');
  cta2.href = cta.href;
  cta2.innerHTML = cta.innerHTML;
  if (cta.target) { cta2.target = cta.target; cta2.rel = cta.rel; }

  // Маршрут с остановками
  const routes = CONFIG.routes;
  if (routes && routes.items && routes.items.length) {
    const list = document.getElementById('routeList');
    routes.items.forEach(function(it){
      const li  = document.createElement('li');
      const fig = document.createElement('figure');
      fig.className = 'stop';
      const img = document.createElement('img');
      img.src = it.img;
      img.loading = 'lazy';           // фото ниже первого экрана грузятся по мере прокрутки
      img.decoding = 'async';
      // подписи городов приходят из словаря языка, здесь только каркас
      fig.append(img, document.createElement('b'), document.createElement('small'));
      li.appendChild(fig);
      list.appendChild(li);
    });

    revealOnScroll(list.querySelectorAll('li'));
  } else {
    document.getElementById('routes').remove();
  }

  // Отзывы
  // Каркас отзывов: количество берём из словаря языка
  const revCount = (dict().reviews || []).length;
  if (revCount) {
    const box = document.getElementById('revList');
    for (let i = 0; i < revCount; i++) {
      const fig = document.createElement('figure');
      fig.className = 'rev';
      const cap = document.createElement('figcaption');
      cap.append(document.createElement('b'), document.createElement('small'));
      fig.append(document.createElement('blockquote'), cap);
      box.appendChild(fig);
    }
    revealOnScroll(box.querySelectorAll('.rev'));
  } else {
    document.getElementById('reviews').remove();
  }

  // Кнопка «поделиться»: системное меню телефона, а если его нет — копирование ссылки
  const share = document.getElementById('shareBtn');
  share.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3.5"/><path d="m8 7 4-4 4 4"/><path d="M5 13v5.5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V13"/></svg><span></span>';
  share.hidden = false;
  share.addEventListener('click', async function(){
    const d = dict();
    const data = {
      title: d.name + ' — ' + b.name,
      text:  d.bio,
      url:   location.href.split('?')[0].split('#')[0]
    };
    if (navigator.share) {
      try { await navigator.share(data); } catch (e) { /* человек закрыл меню — это не ошибка */ }
      return;
    }
    try {
      await navigator.clipboard.writeText(data.url);
      toast(d.shareCopied);
    } catch (e) {
      toast(data.url);
    }
  });

  // Подпись-ссылка внизу. Нет url в конфиге — элемента на странице нет
  const promo = document.getElementById('promo');
  if (CONFIG.promo && CONFIG.promo.url) {
    promo.href = CONFIG.promo.url;
    promo.innerHTML = '<span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6.5 18.5 12 13 17.5"/></svg>';
    promo.hidden = false;
  }

  // Круглые кнопки
  const nav = document.getElementById('links');
  CONFIG.actions.forEach(function(a){
    const href = typeof a.href === 'function' ? a.href(c) : a.href;
    if (!href) return;                       // пункт без данных просто не рисуем
    const el = document.createElement('a');
    el.href = href;
    el.innerHTML = ICONS[a.id] || '';
    el.dataset.id = a.id;
    // внешние ссылки — в новой вкладке; tel:/mailto: — в текущей
    if (/^https?:/i.test(href)) { el.target = '_blank'; el.rel = 'noopener noreferrer'; }
    nav.appendChild(el);
  });
  // Сообщаем CSS фактическое число кнопок — от него считается их размер
  nav.style.setProperty('--n', nav.children.length || 1);

  // Кнопки переключения языка
  const langBox = document.getElementById('langs');
  CONFIG.i18n.order.forEach(function(code){
    const d = CONFIG.i18n.langs[code];
    if (!d) return;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.lang = code;
    btn.textContent = d.label;
    btn.addEventListener('click', function(){ setLang(code); });
    langBox.appendChild(btn);
  });

  applyTexts();
})();

/* ============================================================================
   vCard 3.0 — генерация и скачивание
   ========================================================================== */

/** Экранирование спецсимволов значения по RFC 2426. */
function esc(v){
  return String(v == null ? '' : v)
    .replace(/\\/g, '\\\\')
    .replace(/\r?\n/g, '\\n')
    .replace(/,/g, '\\,')
    .replace(/;/g, '\\;');
}

/**
 * Сворачивание длинных строк: не более 75 символов, продолжение — с пробела.
 * Критично для PHOTO (base64): без этого часть парсеров рвёт файл.
 * Строки с не-ASCII не режем, чтобы не разорвать многобайтовый символ.
 */
function fold(line){
  if (line.length <= 75 || /[^\x00-\x7F]/.test(line)) return line;
  const parts = [line.slice(0, 75)];
  for (let i = 75; i < line.length; i += 74) parts.push(' ' + line.slice(i, i + 74));
  return parts.join('\r\n');
}

/** Собирает текст .vcf из CONFIG. */
function buildVCard(){
  const p = CONFIG.person, b = CONFIG.brand, c = CONFIG.contacts, ad = c.address;
  const L = [];

  L.push('BEGIN:VCARD');
  L.push('VERSION:3.0');
  L.push('N:' + esc(p.lastName) + ';' + esc(p.firstName) + ';;;');
  L.push('FN:' + esc(p.firstName + ' ' + p.lastName + ' — ' + p.company));

  // Кириллическое написание имени — видно в карточке контакта
  if (p.phoneticFirst) L.push('X-PHONETIC-FIRST-NAME:' + esc(p.phoneticFirst));
  if (p.phoneticLast)  L.push('X-PHONETIC-LAST-NAME:'  + esc(p.phoneticLast));

  L.push('ORG:' + esc(p.company));
  L.push('TITLE:' + esc(p.title));
  L.push('TEL;TYPE=CELL,VOICE:' + c.phone);
  L.push('EMAIL;TYPE=INTERNET:' + c.email);
  L.push('URL:' + c.website);                 // сайт — основной URL

  // Соцсети: группы item + X-ABLabel, чтобы в телефоне подписи читались словами,
  // а не одинаковым «URL». iOS показывает метку, Android её игнорирует, но ссылку сохраняет.
  [
    ['Telegram',    c.telegram],
    ['WhatsApp',    c.whatsapp],
    ['Instagram',   c.instagram],
    ['Google Maps', c.maps]
  ].filter(function(pair){ return !!pair[1]; })
   .forEach(function(pair, i){
     const g = 'item' + (i + 1);
     L.push(g + '.URL:' + pair[1]);
     L.push(g + '.X-ABLabel:' + esc(pair[0]));
   });

  if (c.instagram) L.push('X-SOCIALPROFILE;TYPE=instagram:' + c.instagram);

  L.push('ADR;TYPE=WORK:;;' + esc(ad.street) + ';' + esc(ad.city) + ';' + esc(ad.region) + ';' + esc(ad.zip) + ';' + esc(ad.country));
  L.push('NOTE:' + esc(b.tagline));

  // Фото контакта (base64) — самая длинная строка, сворачивается функцией fold()
  if (CONFIG.photo.vcard) L.push('PHOTO;ENCODING=b;TYPE=JPEG:' + CONFIG.photo.vcard);

  L.push('END:VCARD');

  return L.map(fold).join('\r\n') + '\r\n';   // CRLF обязателен по спецификации
}

/* --- Тост --- */
let toastTimer;
function toast(text){
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('is-visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('is-visible'); }, 5200);
}

/**
 * Встроенные браузеры соцсетей (Instagram, Facebook, TikTok и т.п.) часто молча
 * блокируют скачивание файлов — в этом случае подсказываем открыть страницу снаружи.
 */
function isInAppBrowser(){
  const ua = navigator.userAgent || '';
  return /FBAN|FBAV|FB_IAB|Instagram|TikTok|MicroMessenger|Line\//i.test(ua);
}

/**
 * Режим пересборки файла: откройте страницу с ?export в адресе и нажмите кнопку —
 * вместо перехода по ссылке скачается свежий .vcf, собранный из текущего CONFIG.
 * Этот файл кладётся рядом с index.html, и кнопка снова ведёт на него.
 * Нужен только при подготовке визитки, обычный посетитель сюда не попадает.
 */
function exportVCard(){
  const vcf = buildVCard();
  const blob = new Blob([vcf], { type: 'text/vcard;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (CONFIG.ui.vcfFileName || 'contact') + '.vcf';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 4000);
}

/* Поведение кнопок.
   Все они — обычные ссылки, страница в переход не вмешивается: телефон делает
   всё сам. JS добавляет только тактильный отклик, а для контакта — предупреждение
   во встроенных браузерах соцсетей и режим пересборки файла. */
document.querySelectorAll('.cta, .links a, .share, .promo').forEach(function(el){
  el.addEventListener('click', function(e){
    if (navigator.vibrate) { try { navigator.vibrate(12); } catch(err){} }

    // всё дальнейшее касается только ссылки на файл контакта
    if (el.dataset.id !== 'savecontact') return;

    if (/(^|[?&])export($|[=&])/.test(location.search)) {
      e.preventDefault();
      exportVCard();
      return;
    }
    if (isInAppBrowser()) toast(dict().toastInApp);
  });
});
